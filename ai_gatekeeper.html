<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RealSourcing - AI Gatekeeper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            background: #050510;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            width: 1280px;
            height: 720px;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
        }

        /* Background radial glow */
        .bg-glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 50% 60%, rgba(59,130,246,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 300px 300px at 20% 70%, rgba(16,185,129,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 300px 300px at 80% 70%, rgba(16,185,129,0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        /* ─── HEADER ─── */
        .header {
            position: absolute;
            top: 36px;
            left: 80px;
            right: 80px;
        }

        .tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #3B82F6;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 50px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        h1 em { color: #EF4444; font-style: normal; }

        .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.55);
            line-height: 1.6;
            max-width: 820px;
        }

        /* ─── MAIN STAGE ─── */
        .stage {
            position: absolute;
            top: 210px;
            left: 0;
            right: 0;
            height: 370px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            gap: 0;
        }

        /* ─── CENTER: Video Panel (replaces factory list + gatekeeper) ─── */
        .video-panel {
            flex: 1;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.6s;
        }

        .video-panel video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ─── RIGHT: Buyer ─── */
        .buyer-col {
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-left: 24px;
            opacity: 0;
            animation: fadeInRight 0.8s ease forwards 0.8s;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .buyer-lottie-wrap {
            width: 200px;
            height: 160px;
            border-radius: 16px;
            background: rgba(16,185,129,0.06);
            border: 1px solid rgba(16,185,129,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: buyerGlow 3s ease-in-out infinite 2s;
        }

        @keyframes buyerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(16,185,129,0.1); }
            50% { box-shadow: 0 0 40px rgba(16,185,129,0.25); }
        }

        .buyer-lottie { width: 200px; height: 160px; }

        .buyer-info { text-align: center; }

        .buyer-title {
            font-size: 15px;
            font-weight: 700;
            color: #10B981;
            margin-bottom: 4px;
        }

        .buyer-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            line-height: 1.5;
        }

        /* Visible factories card */
        .visible-list {
            width: 100%;
            background: rgba(16,185,129,0.05);
            border: 1px solid rgba(16,185,129,0.15);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .visible-list-title {
            font-size: 10px;
            color: #10B981;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .visible-item {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            padding: 3px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .visible-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #10B981;
            flex-shrink: 0;
        }

        /* ─── STATS ROW ─── */
        .stats-row {
            position: absolute;
            bottom: 58px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 14px 24px;
            text-align: center;
            min-width: 150px;
            opacity: 0;
            animation: fadeInUp 0.7s ease forwards;
        }

        .stat-card:nth-child(1) { animation-delay: 1.8s; }
        .stat-card:nth-child(2) { animation-delay: 2.0s; }
        .stat-card:nth-child(3) { animation-delay: 2.2s; }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #3B82F6;
            margin-bottom: 3px;
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255,255,255,0.45);
        }

        /* ─── WARNING BAR ─── */
        .warning-bar {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.18);
            border-radius: 100px;
            padding: 10px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 2.5s;
        }

        .warning-bar span { color: #EF4444; font-weight: 700; }

        /* ─── KEYFRAMES ─── */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    
    /* === 全局性能优化 === */
    /* 动画元素 GPU 加速 */
    [class*="anim"], [class*="fade"], [class*="slide-in"],
    [class*="float"], [class*="pulse"], [class*="glow"],
    [class*="spin"], [class*="rotate"], [class*="bounce"],
    .card, .metric-card, .track-card, .stat-box,
    .nav-dot, .timeline-node {
        will-change: transform, opacity;
        transform: translateZ(0);
    }
    /* 视频容器 GPU 加速 */
    video { transform: translateZ(0); }
    /* 减少字体渲染开销 */
    body { text-rendering: optimizeSpeed; -webkit-font-smoothing: antialiased; }

    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Header -->
    <div class="header">
        <div class="tag">Present Situation · 现状</div>
        <h1>AI 已成为采购的 <em>守门员</em></h1>
        <p class="subtitle">工厂若无 AI 能力，将彻底"隐形"于全球买家视野之外。2026 年的采购门槛：不是价格，不是质量，而是——你的工厂能被 AI 找到吗？</p>
    </div>

    <!-- Main Stage -->
    <div class="stage">

        <!-- CENTER: Pipeline Video (replaces factory list + gatekeeper) -->
        <div class="video-panel">
            <video autoplay preload="none" loop muted playsinline>
                <source src="assets/ai_pipeline.mp4" type="video/mp4">
            </video>
        </div>

        <!-- RIGHT: Buyer -->
        <div class="buyer-col">
            <div style="font-size:10px; font-weight:700; letter-spacing:2px; color:rgba(255,255,255,0.25); text-transform:uppercase; margin-bottom:4px; text-align:center;">海外采购商</div>
            <div class="buyer-lottie-wrap">
                <div class="buyer-lottie" id="buyer-lottie"></div>
            </div>
            <div class="buyer-info">
                <div class="buyer-title">只看到 AI 推荐的工厂</div>
                <div class="buyer-desc">传统工厂已从视野中消失</div>
            </div>
            <div class="visible-list">
                <div class="visible-list-title">✓ 进入视野的工厂</div>
                <div class="visible-item"><div class="visible-dot"></div>AI 赋能工厂 E · AMR 94</div>
                <div class="visible-item"><div class="visible-dot"></div>AI 赋能工厂 F · AMR 91</div>
            </div>
        </div>
    </div>

    <!-- Stats Row -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value">90%</div>
            <div class="stat-label">B2B 买家使用 AI 采购</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">45%</div>
            <div class="stat-label">AI 为主要寻源方式</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">94%</div>
            <div class="stat-label">采购高管每周使用 AI</div>
        </div>
    </div>

    <!-- Warning Bar -->
    <div class="warning-bar">
        ⚠️ 2026 年的采购门槛：不是价格，不是质量，而是——<span>你的工厂能被 AI 找到吗？</span>
    </div>

    <script>
        // ── Load Lottie animations ──
        // Buyer: 商务人物场景
        lottie.loadAnimation({
            container: document.getElementById('buyer-lottie'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'assets/lottie/ai_circle.json'
        });

        // ── Adaptive scaling to fill viewport ──
        function scaleSlide() {
            const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
            const x = (window.innerWidth - 1280 * s) / 2;
            const y = (window.innerHeight - 720 * s) / 2;
            document.body.style.transform = `scale(${s})`;
            document.body.style.left = x + 'px';
            document.body.style.top = y + 'px';
        }
        scaleSlide();
        window.addEventListener('resize', scaleSlide);
    </script>
</body>
</html>
