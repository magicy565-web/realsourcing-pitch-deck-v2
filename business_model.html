<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>收入飞轮 · RealSourcing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:1280px; height:720px; overflow:hidden; background:#020208; font-family:'Inter','Noto Sans SC',sans-serif; }
        .slide-container { position:relative; width:1280px; height:720px; overflow:hidden; }
        .video-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.10; z-index:0; }
        .bg-overlay { position:absolute; inset:0; z-index:1; background: radial-gradient(ellipse 70% 70% at 50% 55%, rgba(249,115,22,0.07) 0%, transparent 65%), linear-gradient(180deg, rgba(2,2,8,0.6) 0%, rgba(2,2,8,0.85) 100%); }
        .grid-lines { position:absolute; inset:0; z-index:2; opacity:0.025; background-image: linear-gradient(rgba(255,255,255,1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px); background-size:80px 80px; }
        .header { position:absolute; top:26px; left:60px; right:60px; z-index:10; display:flex; align-items:flex-start; justify-content:space-between; opacity:0; animation:fadeInDown 0.7s ease-out forwards 0.1s; }
        .section-tag { display:inline-flex; align-items:center; gap:7px; background:rgba(249,115,22,0.1); border:1px solid rgba(249,115,22,0.28); border-radius:100px; padding:3px 12px; font-size:10px; font-weight:700; color:#F97316; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; }
        .section-tag::before { content:''; width:5px; height:5px; border-radius:50%; background:#F97316; box-shadow:0 0 6px #F97316; animation:pulse 2s infinite; }
        .main-title { font-size:28px; font-weight:900; color:#fff; line-height:1.15; }
        .title-em { background:linear-gradient(90deg,#F97316,#FBBF24); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .header-right { text-align:right; }
        .flywheel-label { font-size:11px; color:rgba(255,255,255,0.3); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
        .flywheel-status { font-size:13px; font-weight:700; color:#F97316; opacity:0; transition:opacity 0.8s; }
        .flywheel-status.visible { opacity:1; }
        .gear-stage { position:absolute; top:88px; left:0; right:0; bottom:0; z-index:10; }
        #gear-canvas { position:absolute; inset:0; }
        .gear-labels { position:absolute; inset:0; pointer-events:none; z-index:15; }
        .gear-label { position:absolute; opacity:0; transition:opacity 1s; display:flex; flex-direction:column; align-items:center; gap:4px; }
        .gear-label.show { opacity:1; }
        .glabel-icon { font-size:20px; line-height:1; }
        .glabel-title { font-size:14px; font-weight:800; color:#fff; white-space:nowrap; }
        .glabel-sub { font-size:10.5px; color:rgba(255,255,255,0.4); white-space:nowrap; }
        .glabel-badge { border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; border:1px solid; white-space:nowrap; margin-top:2px; }
        .timeline { position:absolute; bottom:14px; left:80px; right:80px; z-index:20; opacity:0; animation:fadeInUp 0.7s ease-out forwards 1s; }
        .timeline-track { height:3px; background:rgba(255,255,255,0.08); border-radius:2px; }
        .timeline-fill { height:100%; border-radius:2px; width:0%; background:linear-gradient(90deg,#F97316,#FBBF24,#10B981); transition:width 0.1s linear; }
        .timeline-labels { display:flex; justify-content:space-between; margin-top:7px; }
        .tl-label { font-size:10px; color:rgba(255,255,255,0.22); font-family:'JetBrains Mono',monospace; }
        .tl-label.active { color:rgba(255,255,255,0.65); }
        .bottom-bar { position:absolute; bottom:0; left:0; right:0; height:2px; z-index:30; background:linear-gradient(90deg,#F97316,#FBBF24,#10B981,#4F6EF7); }
        .slide-num { position:absolute; bottom:5px; right:38px; font-size:10px; color:rgba(255,255,255,0.1); font-family:'JetBrains Mono',monospace; z-index:30; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
<div class="slide-container">
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://private-us-east-1.manuscdn.com/user_upload_by_module/session_file/310519663384920352/RJVzyHtxRWwdgQPi.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
    <div class="grid-lines"></div>
    <div class="header">
        <div>
            <div class="section-tag">Revenue Flywheel &middot; 收入飞轮</div>
            <div class="main-title">三条收入线，<span class="title-em">相互咬合加速</span></div>
        </div>
        <div class="header-right">
            <div class="flywheel-label">飞轮状态</div>
            <div class="flywheel-status" id="flywheel-status">正在启动...</div>
        </div>
    </div>
    <div class="gear-stage">
        <canvas id="gear-canvas"></canvas>
        <div class="gear-labels" id="gear-labels">
            <div class="gear-label" id="label-a">
                <div class="glabel-icon">&#127981;</div>
                <div class="glabel-title">工厂订阅</div>
                <div class="glabel-sub">Factory SaaS</div>
                <div class="glabel-badge" style="background:rgba(249,115,22,0.12);border-color:rgba(249,115,22,0.3);color:#FDBA74;">月费 + 成交佣金</div>
            </div>
            <div class="gear-label" id="label-b">
                <div class="glabel-icon">&#128200;</div>
                <div class="glabel-title">采购佣金</div>
                <div class="glabel-sub">Buyer Commission</div>
                <div class="glabel-badge" style="background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.3);color:#6EE7B7;">GMV &times; 2&ndash;5%</div>
            </div>
            <div class="gear-label" id="label-c">
                <div class="glabel-icon">&#9889;</div>
                <div class="glabel-title">增值服务</div>
                <div class="glabel-sub">Value-added Services</div>
                <div class="glabel-badge" style="background:rgba(79,110,247,0.12);border-color:rgba(79,110,247,0.3);color:#A5B8FF;">质检 &middot; 物流 &middot; 金融</div>
            </div>
        </div>
    </div>
    <div class="timeline">
        <div class="timeline-track"><div class="timeline-fill" id="timeline-fill"></div></div>
        <div class="timeline-labels">
            <span class="tl-label" id="tl-0">启动期</span>
            <span class="tl-label" id="tl-1">增长期</span>
            <span class="tl-label" id="tl-2">加速期</span>
            <span class="tl-label" id="tl-3">飞轮全速 &#128640;</span>
        </div>
    </div>
    <div class="slide-num">17 / 25</div>
    <div class="bottom-bar"></div>
</div>
<script>
(function(){
    var canvas=document.getElementById('gear-canvas');
    var ctx=canvas.getContext('2d');
    var W=1280,H=720-88;
    canvas.width=W; canvas.height=H;
    var RA=158,RB=112,RC=82;
    var TA=36,TB=26,TC=19;
    var pA=RA-14,pB=RB-10,pC=RC-8;
    var AX=W/2-(pA+pB)/2-20, AY=H-55;
    var BX=AX+(pA+pB), BY=AY;
    var angBC=-Math.PI*0.60;
    var CX=BX+(pB+pC)*Math.cos(angBC), CY=BY+(pB+pC)*Math.sin(angBC);
    var rAB=TA/TB, rBC=TB/TC;
    var DUR=13000;
    var t0=null,lt=null,aA=0,aB=0,aC=0;
    function sm(t){
        if(t<0.22) return t*t*0.9;
        if(t<0.58) return 0.044+Math.pow((t-0.22)/0.36,1.9)*0.46;
        return 0.504+Math.pow((t-0.58)/0.42,1.3)*0.496;
    }
    var BASE=0.0019;
    function gPath(cx,cy,oR,iR,teeth,ao){
        var s=Math.PI*2/teeth,tw=s*0.38;
        ctx.beginPath();
        for(var i=0;i<teeth;i++){
            var a0=ao+i*s-tw/2,a1=ao+i*s+tw/2,a2=ao+(i+.5)*s-tw*.28,a3=ao+(i+.5)*s+tw*.28;
            if(i===0) ctx.moveTo(cx+iR*Math.cos(a0),cy+iR*Math.sin(a0));
            else ctx.lineTo(cx+iR*Math.cos(a0),cy+iR*Math.sin(a0));
            ctx.lineTo(cx+oR*Math.cos(a0),cy+oR*Math.sin(a0));
            ctx.lineTo(cx+oR*Math.cos(a1),cy+oR*Math.sin(a1));
            ctx.lineTo(cx+iR*Math.cos(a1),cy+iR*Math.sin(a1));
            ctx.lineTo(cx+iR*Math.cos(a2),cy+iR*Math.sin(a2));
            ctx.lineTo(cx+iR*Math.cos(a3),cy+iR*Math.sin(a3));
        }
        ctx.closePath();
    }
    function dGear(cx,cy,oR,iR,hR,teeth,ang,c,gc,gi){
        ctx.save();
        if(gi>0){ctx.shadowColor=gc;ctx.shadowBlur=18+gi*38;}
        var g=ctx.createRadialGradient(cx,cy,hR,cx,cy,oR);
        g.addColorStop(0,c.i); g.addColorStop(1,c.o);
        gPath(cx,cy,oR,iR,teeth,ang);
        ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle=c.s; ctx.lineWidth=1.5; ctx.stroke();
        ctx.shadowBlur=0;
        ctx.beginPath(); ctx.arc(cx,cy,iR*.72,0,Math.PI*2);
        ctx.fillStyle=c.f; ctx.fill();
        ctx.strokeStyle=c.s; ctx.lineWidth=1; ctx.stroke();
        ctx.strokeStyle=c.sp; ctx.lineWidth=2.5;
        for(var i=0;i<6;i++){
            var a=ang+i*Math.PI/3;
            ctx.beginPath();
            ctx.moveTo(cx+hR*1.15*Math.cos(a),cy+hR*1.15*Math.sin(a));
            ctx.lineTo(cx+iR*.68*Math.cos(a),cy+iR*.68*Math.sin(a));
            ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(cx,cy,hR,0,Math.PI*2);
        ctx.fillStyle=c.h; ctx.fill();
        ctx.strokeStyle=c.s; ctx.lineWidth=2; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx,cy,hR*.35,0,Math.PI*2);
        ctx.fillStyle=c.s; ctx.fill();
        ctx.restore();
    }
    var pts=[];
    function spP(x,y,col,spd){
        if(Math.random()>spd*1.6) return;
        var a=Math.random()*Math.PI*2;
        pts.push({x:x,y:y,vx:Math.cos(a)*(1+spd*3),vy:Math.sin(a)*(1+spd*3),life:1,decay:.03+spd*.04,col:col,sz:1.5+spd*2});
    }
    function dPts(){
        for(var i=pts.length-1;i>=0;i--){
            var p=pts[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
            if(p.life<=0){pts.splice(i,1);continue;}
            ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);
            ctx.fillStyle=p.col.replace('rgb','rgba').replace(')',','+p.life+')');
            ctx.fill();
        }
    }
    function posL(){
        var lA=document.getElementById('label-a');
        var lB=document.getElementById('label-b');
        var lC=document.getElementById('label-c');
        lA.style.cssText='left:'+(AX-RA-168)+'px;top:'+(AY-50)+'px;align-items:flex-end;';
        lB.style.cssText='left:'+(BX+RB+12)+'px;top:'+(BY-50)+'px;align-items:flex-start;';
        lC.style.cssText='left:'+(CX-85)+'px;top:'+(CY-RC-98)+'px;align-items:center;width:170px;';
    }
    var stEl=document.getElementById('flywheel-status');
    var tlF=document.getElementById('timeline-fill');
    var stTxt=['缓慢启动中...','增长势能积累中...','飞轮加速中...','飞轮全速运转'];
    var lph=-1;
    function updUI(t){
        tlF.style.width=(t*100)+'%';
        var ph=t<.25?0:t<.55?1:t<.82?2:3;
        for(var i=0;i<=3;i++) document.getElementById('tl-'+i).classList.toggle('active',i<=ph);
        if(ph!==lph){lph=ph;stEl.classList.remove('visible');setTimeout(function(){stEl.textContent=stTxt[ph];stEl.classList.add('visible');},100);}
    }
    var cA={i:'rgba(249,115,22,0.35)',o:'rgba(180,60,0,0.5)',f:'rgba(30,15,5,0.92)',s:'rgba(249,115,22,0.75)',sp:'rgba(249,115,22,0.4)',h:'rgba(249,115,22,0.65)'};
    var cB={i:'rgba(16,185,129,0.35)',o:'rgba(5,100,60,0.5)',f:'rgba(5,20,15,0.92)',s:'rgba(16,185,129,0.75)',sp:'rgba(16,185,129,0.4)',h:'rgba(16,185,129,0.65)'};
    var cC={i:'rgba(79,110,247,0.35)',o:'rgba(30,50,180,0.5)',f:'rgba(5,8,25,0.92)',s:'rgba(79,110,247,0.75)',sp:'rgba(79,110,247,0.4)',h:'rgba(79,110,247,0.65)'};
    var mABx=AX+(pA/(pA+pB))*(BX-AX), mABy=AY+(pA/(pA+pB))*(BY-AY);
    var mBCx=BX+(pB/(pB+pC))*(CX-BX), mBCy=BY+(pB/(pB+pC))*(CY-BY);
    function meshL(alpha){
        ctx.save();
        ctx.strokeStyle='rgba(255,255,255,'+(alpha*0.1)+')';
        ctx.lineWidth=1; ctx.setLineDash([4,8]);
        ctx.beginPath(); ctx.moveTo(AX,AY); ctx.lineTo(BX,BY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(BX,BY); ctx.lineTo(CX,CY); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
    }
    function frame(ts){
        if(!t0) t0=ts;
        var el=ts-t0,t=Math.min(el/DUR,1),s=sm(t);
        var dt=lt?ts-lt:16; lt=ts;
        var wA=BASE*s*dt;
        aA+=wA; aB-=wA*rAB; aC+=wA*rAB*rBC;
        ctx.clearRect(0,0,W,H);
        meshL(s);
        dGear(AX,AY,RA,RA-14,22,TA,aA,cA,'rgb(249,115,22)',s);
        dGear(BX,BY,RB,RB-10,16,TB,aB,cB,'rgb(16,185,129)',s*.7);
        dGear(CX,CY,RC,RC-8, 12,TC,aC,cC,'rgb(79,110,247)',s*.5);
        spP(mABx,mABy,'rgb(249,200,100)',s);
        spP(mBCx,mBCy,'rgb(100,220,180)',s);
        dPts();
        if(el>500){
            document.getElementById('label-a').classList.add('show');
            document.getElementById('label-b').classList.add('show');
            document.getElementById('label-c').classList.add('show');
        }
        updUI(t);
        requestAnimationFrame(t<1?frame:loop);
    }
    function loop(ts){
        var dt=lt?ts-lt:16; lt=ts;
        var wA=BASE*dt;
        aA+=wA; aB-=wA*rAB; aC+=wA*rAB*rBC;
        ctx.clearRect(0,0,W,H);
        meshL(1);
        dGear(AX,AY,RA,RA-14,22,TA,aA,cA,'rgb(249,115,22)',1);
        dGear(BX,BY,RB,RB-10,16,TB,aB,cB,'rgb(16,185,129)',.7);
        dGear(CX,CY,RC,RC-8, 12,TC,aC,cC,'rgb(79,110,247)',.5);
        spP(mABx,mABy,'rgb(249,200,100)',1);
        spP(mBCx,mBCy,'rgb(100,220,180)',1);
        dPts();
        requestAnimationFrame(loop);
    }
    posL();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
