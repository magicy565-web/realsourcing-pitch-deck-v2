<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSourcing - Competition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            padding: 50px 60px 0; /* keep top padding for title, remove bottom padding to save height */
            display: flex;
            flex-direction: column;
        }

        /* Background Elements */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            z-index: 0;
        }
        .orb-1 { top: -100px; right: 10%; width: 600px; height: 600px; background: #4F6EF7; }
        .orb-2 { bottom: -100px; left: 10%; width: 500px; height: 500px; background: #8E44AD; }

        /* Header */
        .header {
            z-index: 2;
            margin-bottom: 30px;
            text-align: center;
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .section-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4F6EF7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
        }

        /* Comparison Matrix */
        .matrix-container {
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.2fr;
            gap: 10px; /* slightly reduced to save vertical space */
            margin-bottom: 22px; /* shrink space to moat */
        }

        /* Column Headers */
        .col-header {
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .col-header.highlight {
            color: #FFF;
            background: linear-gradient(90deg, #4F6EF7, #8E44AD);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 2px solid #4F6EF7;
        }

        /* Matrix Cells */
        .matrix-row {
            display: contents;
        }

        .cell {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 12px; /* slightly reduced inner padding */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            opacity: 0;
            transform: translateY(10px);
        }

        .cell.highlight {
            background: rgba(79, 110, 247, 0.1);
            border: 1px solid rgba(79, 110, 247, 0.3);
            color: #FFF;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(79, 110, 247, 0.1);
        }

        .icon-check { color: #2ECC71; margin-right: 5px; }
        .icon-cross { color: #E74C3C; margin-right: 5px; opacity: 0.5; }

        /* Row Animations */
        .row-1 .cell { animation: fadeInUp 0.5s ease-out forwards 0.2s; }
        .row-2 .cell { animation: fadeInUp 0.5s ease-out forwards 0.3s; }
        .row-3 .cell { animation: fadeInUp 0.5s ease-out forwards 0.4s; }
        .row-4 .cell { animation: fadeInUp 0.5s ease-out forwards 0.5s; }
        .row-5 .cell { animation: fadeInUp 0.5s ease-out forwards 0.6s; }
        .row-6 .cell { animation: fadeInUp 0.5s ease-out forwards 0.7s; }

        /* Footer Moat */
        .moat-container {
            z-index: 2;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px; /* reduced from 20px to save height */
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            border-radius: 12px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 1s;
        }

        .moat-text {
            font-size: 1.1rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        /* Animations */
        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>

        <div class="header">
            <div class="section-tag">COMPETITION</div>
            <h1 class="main-title">我们不是更好的阿里，我们是新的品类</h1>
        </div>

        <div class="matrix-container">
            <!-- Headers -->
            <div class="col-header">Alibaba</div>
            <div class="col-header">1688</div>
            <div class="col-header">Global Sources</div>
            <div class="col-header highlight">RealSourcing</div>

            <!-- Row 1: Target -->
            <div class="matrix-row row-1">
                <div class="cell">全部 (杂乱)</div>
                <div class="cell">国内为主</div>
                <div class="cell">大型进口商</div>
                <div class="cell highlight">中小买家 / Dropshipper</div>
            </div>

            <!-- Row 2: Speed -->
            <div class="matrix-row row-2">
                <div class="cell">3–7 天</div>
                <div class="cell">1–3 天</div>
                <div class="cell">1–2 周</div>
                <div class="cell highlight"><i class="fas fa-bolt icon-check"></i> &lt; 30 分钟</div>
            </div>

            <!-- Row 3: Verification -->
            <div class="matrix-row row-3">
                <div class="cell">自填信息</div>
                <div class="cell">极少验证</div>
                <div class="cell">人工审计</div>
                <div class="cell highlight"><i class="fas fa-robot icon-check"></i> AI AMR 评分</div>
            </div>

            <!-- Row 4: Video -->
            <div class="matrix-row row-4">
                <div class="cell"><i class="fas fa-times icon-cross"></i> 无</div>
                <div class="cell"><i class="fas fa-times icon-cross"></i> 无</div>
                <div class="cell">有限支持</div>
                <div class="cell highlight"><i class="fas fa-video icon-check"></i> 原生 Webinar</div>
            </div>

            <!-- Row 5: AI Quote -->
            <div class="matrix-row row-5">
                <div class="cell"><i class="fas fa-times icon-cross"></i> 无</div>
                <div class="cell"><i class="fas fa-times icon-cross"></i> 无</div>
                <div class="cell"><i class="fas fa-times icon-cross"></i> 无</div>
                <div class="cell highlight"><i class="fas fa-magic icon-check"></i> OpenClaw Agent</div>
            </div>

            <!-- Row 6: MOQ -->
            <div class="matrix-row row-6">
                <div class="cell">高 / 僵化</div>
                <div class="cell">中等</div>
                <div class="cell">极高</div>
                <div class="cell highlight"><i class="fas fa-box-open icon-check"></i> 灵活 / 低门槛</div>
            </div>
        </div>

        <div class="moat-container">
            <p class="moat-text">"我们的竞争优势不是功能，而是我们正在构建的信任基础设施：每一笔交易都在沉淀真实的买家口碑和工厂信用，形成无法复制的数据护城河。"</p>
        </div>
    </div>
</body>
</html>
