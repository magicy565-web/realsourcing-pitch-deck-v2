<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>竞争格局 · RealSourcing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:1280px; height:720px; overflow:hidden; background:#020208; font-family:"Inter","Noto Sans SC",sans-serif; }
        .slide { position:relative; width:1280px; height:720px; overflow:hidden; }
        .bg-nebula { position:absolute; inset:0; z-index:1;
            background: radial-gradient(ellipse 55% 55% at 60% 52%, rgba(79,110,247,0.13) 0%, transparent 60%),
                        radial-gradient(ellipse 30% 30% at 28% 72%, rgba(249,115,22,0.06) 0%, transparent 55%),
                        radial-gradient(ellipse 20% 20% at 78% 22%, rgba(16,185,129,0.05) 0%, transparent 50%); }
        #stars-canvas { position:absolute; inset:0; z-index:0; }
        #galaxy-canvas { position:absolute; inset:0; z-index:2; }
        .manifesto { position:absolute; left:58px; top:50%; transform:translateY(-50%); z-index:20;
            display:flex; flex-direction:column; gap:0; opacity:0;
            animation: fadeSlideRight 1.2s cubic-bezier(0.22,1,0.36,1) forwards 0.3s; }
        .manifesto-eyebrow { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
            color:rgba(255,255,255,0.3); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
        .manifesto-eyebrow::before { content:""; display:block; width:24px; height:1px; background:rgba(255,255,255,0.2); }
        .manifesto-line1 { font-size:32px; font-weight:900; color:#fff; line-height:1.1; white-space:nowrap; }
        .manifesto-line2 { font-size:32px; font-weight:900; line-height:1.1; white-space:nowrap;
            background:linear-gradient(90deg,#4F6EF7,#06B6D4); -webkit-background-clip:text;
            -webkit-text-fill-color:transparent; background-clip:text; }
        .manifesto-divider { width:40px; height:2px; background:linear-gradient(90deg,#4F6EF7,transparent); margin:18px 0; }
        .manifesto-sub { font-size:13px; font-weight:500; color:rgba(255,255,255,0.45); line-height:1.8; max-width:260px; }
        .manifesto-sub em { font-style:normal; color:rgba(255,255,255,0.75); font-weight:600; }
        .closing-line { position:absolute; right:58px; bottom:52px; z-index:20; text-align:right;
            opacity:0; animation: fadeSlideLeft 1s ease-out forwards 2.8s; }
        .closing-line p { font-size:12px; color:rgba(255,255,255,0.25); font-style:italic; margin-bottom:4px; }
        .closing-line strong { font-size:15px; color:rgba(255,255,255,0.55); font-weight:700; font-style:normal; }
        .bottom-bar { position:absolute; bottom:0; left:0; right:0; height:2px; z-index:30;
            background:linear-gradient(90deg,#4F6EF7,#06B6D4,#10B981,#F97316); }
        .slide-num { position:absolute; bottom:6px; right:38px; font-size:10px;
            color:rgba(255,255,255,0.1); font-family:"JetBrains Mono",monospace; z-index:30; }
        @keyframes fadeSlideRight {
            from { opacity:0; transform:translate(-24px,-50%); }
            to   { opacity:1; transform:translate(0,-50%); }
        }
        @keyframes fadeSlideLeft {
            from { opacity:0; transform:translateX(16px); }
            to   { opacity:1; transform:translateX(0); }
        }
    </style>
</head>
<body>
<div class="slide">
    <canvas id="stars-canvas"></canvas>
    <div class="bg-nebula"></div>
    <canvas id="galaxy-canvas"></canvas>
    <div class="manifesto">
        <div class="manifesto-eyebrow">Competition &middot; 竞争格局</div>
        <div class="manifesto-line1">We don't compete</div>
        <div class="manifesto-line2">in their galaxy.</div>
        <div class="manifesto-divider"></div>
        <div class="manifesto-sub">
            他们在优化<em>旧系统</em>，<br>
            我们在建立<em>新规则</em>。<br><br>
            RealSourcing 是一个<em>新品类</em>，<br>
            不是更好的阿里巴巴。
        </div>
    </div>
    <div class="closing-line">
        <p>他们是上一个时代的遗迹</p>
        <strong>We built a new one.</strong>
    </div>
    <div class="slide-num">20 / 25</div>
    <div class="bottom-bar"></div>
</div>
<script>
(function(){
    var c=document.getElementById("stars-canvas");
    c.width=1280; c.height=720;
    var ctx=c.getContext("2d");
    var stars=[];
    for(var i=0;i<220;i++){
        stars.push({x:Math.random()*1280,y:Math.random()*720,r:Math.random()*1.2+0.2,
            a:Math.random()*0.5+0.1,tw:Math.random()*3+1.5,tp:Math.random()*Math.PI*2});
    }
    function drawStars(t){
        ctx.clearRect(0,0,1280,720);
        stars.forEach(function(s){
            var alpha=s.a*(0.6+0.4*Math.sin(t/s.tw+s.tp));
            ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fillStyle="rgba(255,255,255,"+alpha+")"; ctx.fill();
        });
        requestAnimationFrame(function(ts){ drawStars(ts/1000); });
    }
    drawStars(0);
})();

(function(){
    var canvas=document.getElementById("galaxy-canvas");
    canvas.width=1280; canvas.height=720;
    var ctx=canvas.getContext("2d");
    var CX=760, CY=360;

    var advantages=[
        {label:"智能", sub:"AI-Native",  color:"#4F6EF7", r:148, speed:0.36, angle:0.2,   detail:"AI 自动匹配 + 报价"},
        {label:"敏捷", sub:"Agile",      color:"#06B6D4", r:200, speed:0.26, angle:1.77,  detail:"24h 响应，无需展会"},
        {label:"成长", sub:"Growth",     color:"#10B981", r:158, speed:0.20, angle:3.34,  detail:"工厂 SaaS 飞轮效应"},
        {label:"真实", sub:"Authentic",  color:"#F97316", r:188, speed:0.30, angle:5.10,  detail:"真实工厂 · 真实价格"}
    ];

    var competitors=[
        {label:"阿里巴巴", tag:"目录平台",   tx:-265, ty:-100, color:"rgba(255,255,255,0.18)"},
        {label:"速卖通",   tag:"低价竞争",   tx: 255, ty:-155, color:"rgba(255,255,255,0.15)"},
        {label:"环球资源", tag:"展会依赖",   tx:-215, ty: 195, color:"rgba(255,255,255,0.13)"},
        {label:"传统外贸", tag:"信息不对称", tx: 195, ty: 215, color:"rgba(255,255,255,0.12)"}
    ];

    var BURST_DUR=1200, ORBIT_START=1600, COMP_START=2600;
    var t0=null;

    var burstPts=[];
    for(var i=0;i<120;i++){
        var a=Math.random()*Math.PI*2, spd=Math.random()*5+1.5;
        burstPts.push({x:CX,y:CY,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
            life:1,decay:0.007+Math.random()*0.014,r:Math.random()*2.5+0.5,
            col:["#4F6EF7","#06B6D4","#A5B8FF","#fff"][Math.floor(Math.random()*4)]});
    }

    function hexRgba(hex,a){
        var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
        return "rgba("+r+","+g+","+b+","+a+")";
    }
    function easeOut(t){ return 1-Math.pow(1-t,3); }
    function easeOutBack(t){ var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

    function drawBurstPts(elapsed){
        if(elapsed>BURST_DUR*2) return;
        burstPts.forEach(function(p){
            if(p.life<=0) return;
            p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
            if(p.life<=0) return;
            var r=parseInt(p.col.slice(1,3),16),g=parseInt(p.col.slice(3,5),16),b=parseInt(p.col.slice(5,7),16);
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
            ctx.fillStyle="rgba("+r+","+g+","+b+","+Math.max(0,p.life)+")"; ctx.fill();
        });
    }

    function drawCenter(cp, elapsed){
        var glowR=52+Math.sin(elapsed/900)*5;
        // 大光晕
        var g1=ctx.createRadialGradient(CX,CY,0,CX,CY,glowR*4);
        g1.addColorStop(0,hexRgba("#4F6EF7",0.32*cp));
        g1.addColorStop(0.45,hexRgba("#06B6D4",0.12*cp));
        g1.addColorStop(1,"rgba(0,0,0,0)");
        ctx.beginPath(); ctx.arc(CX,CY,glowR*4,0,Math.PI*2); ctx.fillStyle=g1; ctx.fill();
        // 脉冲环
        var pr=glowR*1.7+Math.sin(elapsed/550)*10;
        ctx.beginPath(); ctx.arc(CX,CY,pr,0,Math.PI*2);
        ctx.strokeStyle=hexRgba("#4F6EF7",0.22*cp); ctx.lineWidth=1.5; ctx.stroke();
        var pr2=glowR*2.4+Math.sin(elapsed/800+1)*12;
        ctx.beginPath(); ctx.arc(CX,CY,pr2,0,Math.PI*2);
        ctx.strokeStyle=hexRgba("#06B6D4",0.10*cp); ctx.lineWidth=1; ctx.stroke();
        // 核心
        var cg=ctx.createRadialGradient(CX,CY,0,CX,CY,glowR);
        cg.addColorStop(0,"#fff");
        cg.addColorStop(0.25,hexRgba("#A5B8FF",1));
        cg.addColorStop(0.65,hexRgba("#4F6EF7",0.9));
        cg.addColorStop(1,hexRgba("#4F6EF7",0));
        ctx.beginPath(); ctx.arc(CX,CY,glowR,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
        // 标注
        if(cp>0.45){
            var ta=Math.min(1,(cp-0.45)*1.8);
            ctx.save(); ctx.globalAlpha=ta;
            ctx.textAlign="center";
            ctx.font="900 16px Inter,sans-serif"; ctx.fillStyle="#fff";
            ctx.fillText("RealSourcing",CX,CY-glowR-24);
            ctx.font="500 10px Inter,sans-serif"; ctx.fillStyle="rgba(165,184,255,0.8)";
            ctx.fillText("AI-Native Trade OS",CX,CY-glowR-9);
            ctx.restore();
        }
    }

    function drawOrbits(elapsed, op){
        if(op<=0) return;
        advantages.forEach(function(adv,idx){
            var delay=idx*0.15;
            var p=Math.max(0,Math.min(1,(op-delay)/(1-delay*0.6)));
            if(p<=0) return;
            adv.angle+=adv.speed*0.016;
            var ox=CX+adv.r*Math.cos(adv.angle);
            var oy=CY+adv.r*Math.sin(adv.angle);
            // 轨道虚线
            ctx.save();
            ctx.beginPath(); ctx.arc(CX,CY,adv.r,0,Math.PI*2);
            ctx.strokeStyle=hexRgba(adv.color,0.10*p);
            ctx.lineWidth=1; ctx.setLineDash([3,9]); ctx.stroke();
            ctx.setLineDash([]); ctx.restore();
            // 拖尾
            var trailLen=20;
            for(var ti=1;ti<=trailLen;ti++){
                var ta2=adv.angle-adv.speed*0.016*ti*2;
                var tx2=CX+adv.r*Math.cos(ta2), ty2=CY+adv.r*Math.sin(ta2);
                ctx.beginPath(); ctx.arc(tx2,ty2,3*(1-ti/trailLen),0,Math.PI*2);
                ctx.fillStyle=hexRgba(adv.color,(0.4*(1-ti/trailLen))*p); ctx.fill();
            }
            // 节点光晕
            var ng=ctx.createRadialGradient(ox,oy,0,ox,oy,30);
            ng.addColorStop(0,hexRgba(adv.color,0.45*p));
            ng.addColorStop(1,"rgba(0,0,0,0)");
            ctx.beginPath(); ctx.arc(ox,oy,30,0,Math.PI*2); ctx.fillStyle=ng; ctx.fill();
            // 节点核心
            ctx.beginPath(); ctx.arc(ox,oy,9,0,Math.PI*2);
            ctx.fillStyle=hexRgba(adv.color,0.95*p); ctx.fill();
            ctx.strokeStyle="rgba(255,255,255,0.55)"; ctx.lineWidth=1.5; ctx.stroke();
            ctx.beginPath(); ctx.arc(ox,oy,3.5,0,Math.PI*2);
            ctx.fillStyle="#fff"; ctx.fill();
            // 标签
            ctx.save(); ctx.globalAlpha=p;
            var lx=ox+(ox>CX?18:-18), ly=oy;
            var align=ox>CX?"left":"right";
            ctx.textAlign=align;
            ctx.font="800 15px Inter,"Noto Sans SC",sans-serif";
            ctx.fillStyle="#fff"; ctx.fillText(adv.label,lx,ly);
            ctx.font="600 10px Inter,sans-serif";
            ctx.fillStyle=hexRgba(adv.color,0.9); ctx.fillText(adv.sub,lx,ly+14);
            ctx.font="400 9.5px Inter,sans-serif";
            ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.fillText(adv.detail,lx,ly+27);
            ctx.restore();
        });
    }

    function drawCompetitors(elapsed, cp2){
        if(cp2<=0) return;
        competitors.forEach(function(comp,idx){
            var delay=idx*0.18;
            var p=Math.max(0,Math.min(1,(cp2-delay)/(1-delay*0.5)));
            if(p<=0) return;
            var finalX=CX+comp.tx, finalY=CY+comp.ty;
            var startX=CX+comp.tx*2.8, startY=CY+comp.ty*2.8;
            var cx2=startX+(finalX-startX)*p;
            var cy2=startY+(finalY-startY)*p;
            // 微弱光晕
            var ng=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,24);
            ng.addColorStop(0,"rgba(255,255,255,0.07)"); ng.addColorStop(1,"rgba(0,0,0,0)");
            ctx.beginPath(); ctx.arc(cx2,cy2,24,0,Math.PI*2); ctx.fillStyle=ng; ctx.fill();
            // 暗淡星体
            ctx.beginPath(); ctx.arc(cx2,cy2,5.5,0,Math.PI*2);
            ctx.fillStyle="rgba(255,255,255,"+0.20*p+")"; ctx.fill();
            // 标签
            ctx.save(); ctx.globalAlpha=0.52*p;
            ctx.textAlign="center";
            ctx.font="600 12px Inter,"Noto Sans SC",sans-serif";
            ctx.fillStyle="rgba(255,255,255,0.5)"; ctx.fillText(comp.label,cx2,cy2-14);
            ctx.font="400 9px Inter,sans-serif";
            ctx.fillStyle="rgba(255,255,255,0.28)"; ctx.fillText(comp.tag,cx2,cy2+1);
            ctx.restore();
            // 极淡虚线
            ctx.save();
            ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(cx2,cy2);
            ctx.strokeStyle="rgba(255,255,255,"+0.035*p+")";
            ctx.lineWidth=0.8; ctx.setLineDash([3,14]); ctx.stroke();
            ctx.setLineDash([]); ctx.restore();
        });
    }

    function frame(ts){
        if(!t0) t0=ts;
        var elapsed=ts-t0;
        ctx.clearRect(0,0,1280,720);
        var burstP=Math.min(1,elapsed/BURST_DUR);
        var centerP=easeOut(burstP);
        var orbitP=elapsed>ORBIT_START?easeOut(Math.min(1,(elapsed-ORBIT_START)/2200)):0;
        var compP=elapsed>COMP_START?easeOut(Math.min(1,(elapsed-COMP_START)/2800)):0;
        drawBurstPts(elapsed);
        drawCenter(centerP,elapsed);
        drawOrbits(elapsed,orbitP);
        drawCompetitors(elapsed,compP);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
