<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>竞争格局 · RealSourcing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1280px; height:720px; overflow:hidden; background:#020208; font-family:"Inter","Noto Sans SC",sans-serif; }
.slide { position:relative; width:1280px; height:720px; overflow:hidden; }
.bg-nebula {
  position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(ellipse 55% 55% at 60% 52%, rgba(79,110,247,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 30% 30% at 28% 72%, rgba(249,115,22,0.05) 0%, transparent 55%),
    radial-gradient(ellipse 20% 20% at 78% 22%, rgba(16,185,129,0.04) 0%, transparent 50%);
}
#stars-canvas { position:absolute; inset:0; z-index:0; width:1280px; height:720px; }
#galaxy-canvas { position:absolute; inset:0; z-index:2; width:1280px; height:720px; }
.manifesto {
  position:absolute; left:58px; top:50%; transform:translateY(-50%); z-index:20;
  display:flex; flex-direction:column; gap:0; opacity:0;
  animation: fadeSlideRight 1.2s cubic-bezier(0.22,1,0.36,1) forwards 0.3s;
}
.manifesto-eyebrow {
  font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
  color:rgba(255,255,255,0.3); margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.manifesto-eyebrow::before { content:""; display:block; width:24px; height:1px; background:rgba(255,255,255,0.2); }
.manifesto-line1 { font-size:32px; font-weight:900; color:#fff; line-height:1.1; white-space:nowrap; }
.manifesto-line2 {
  font-size:32px; font-weight:900; line-height:1.1; white-space:nowrap;
  background:linear-gradient(90deg,#4F6EF7,#06B6D4); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; background-clip:text;
}
.manifesto-divider { width:40px; height:2px; background:linear-gradient(90deg,#4F6EF7,transparent); margin:18px 0; }
.manifesto-sub { font-size:13px; font-weight:500; color:rgba(255,255,255,0.45); line-height:1.8; max-width:260px; }
.manifesto-sub em { font-style:normal; color:rgba(255,255,255,0.75); font-weight:600; }
.closing-line {
  position:absolute; right:58px; bottom:52px; z-index:20; text-align:right;
  opacity:0; animation: fadeSlideLeft 1s ease-out forwards 2.8s;
}
.closing-line p { font-size:12px; color:rgba(255,255,255,0.25); font-style:italic; margin-bottom:4px; }
.closing-line strong { font-size:15px; color:rgba(255,255,255,0.55); font-weight:700; }
.bottom-bar {
  position:absolute; bottom:0; left:0; right:0; height:2px; z-index:30;
  background:linear-gradient(90deg,#4F6EF7,#06B6D4,#10B981,#F97316);
}
.slide-num {
  position:absolute; bottom:6px; right:38px; font-size:10px;
  color:rgba(255,255,255,0.1); font-family:"JetBrains Mono",monospace; z-index:30;
}
@keyframes fadeSlideRight {
  from { opacity:0; transform:translate(-24px,-50%); }
  to   { opacity:1; transform:translate(0,-50%); }
}
@keyframes fadeSlideLeft {
  from { opacity:0; transform:translateX(16px); }
  to   { opacity:1; transform:translateX(0); }
}

    /* === 全局性能优化 === */
    /* 动画元素 GPU 加速 */
    [class*="anim"], [class*="fade"], [class*="slide-in"],
    [class*="float"], [class*="pulse"], [class*="glow"],
    [class*="spin"], [class*="rotate"], [class*="bounce"],
    .card, .metric-card, .track-card, .stat-box,
    .nav-dot, .timeline-node {
        will-change: transform, opacity;
        transform: translateZ(0);
    }
    /* 视频容器 GPU 加速 */
    video { transform: translateZ(0); }
    /* 减少字体渲染开销 */
    body { text-rendering: optimizeSpeed; -webkit-font-smoothing: antialiased; }

    </style>
</head>
<body>
<div class="slide">
  <canvas id="stars-canvas"></canvas>
  <div class="bg-nebula"></div>
  <canvas id="galaxy-canvas"></canvas>
  <div class="manifesto">
    <div class="manifesto-eyebrow">Competition &middot; 竞争格局</div>
    <div class="manifesto-line1">We don't compete</div>
    <div class="manifesto-line2">in their galaxy.</div>
    <div class="manifesto-divider"></div>
    <div class="manifesto-sub">
      他们在优化<em>旧系统</em>，<br>
      我们在建立<em>新规则</em>。<br><br>
      RealSourcing 是一个<em>新品类</em>，<br>
      不是更好的阿里巴巴。
    </div>
  </div>
  <div class="closing-line">
    <p>他们是上一个时代的遗迹</p>
    <strong>We built a new one.</strong>
  </div>
  <div class="slide-num">20 / 25</div>
  <div class="bottom-bar"></div>
</div>

<script>
// ── 背景星空 ──────────────────────────────────────────────────
(function() {
  var sc = document.getElementById('stars-canvas');
  sc.width = 1280; sc.height = 720;
  var ctx = sc.getContext('2d');
  var stars = [];
  for (var i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * 1280, y: Math.random() * 720,
      r: Math.random() * 1.1 + 0.2,
      a: Math.random() * 0.45 + 0.08,
      tw: Math.random() * 3 + 1.5,
      tp: Math.random() * Math.PI * 2
    });
  }
  var lastT = 0;
  function drawStars(ts) {
    var t = ts / 1000;
    ctx.clearRect(0, 0, 1280, 720);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var alpha = s.a * (0.6 + 0.4 * Math.sin(t / s.tw + s.tp));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);
})();

// ── 主星系动画 ────────────────────────────────────────────────
(function() {
  var canvas = document.getElementById('galaxy-canvas');
  canvas.width = 1280; canvas.height = 720;
  var ctx = canvas.getContext('2d');

  var CX = 760, CY = 360;

  // 四个优势词轨道
  var advantages = [
    { label: '智能', sub: 'AI-Native',  color: '#4F6EF7', r: 148, speed: 0.5,  angle: 0.2,  detail: 'AI 自动匹配 + 报价' },
    { label: '敏捷', sub: 'Agile',      color: '#06B6D4', r: 200, speed: 0.35, angle: 1.77, detail: '24h 响应，无需展会' },
    { label: '成长', sub: 'Growth',     color: '#10B981', r: 158, speed: 0.28, angle: 3.34, detail: '工厂 SaaS 飞轮效应' },
    { label: '真实', sub: 'Authentic',  color: '#F97316', r: 188, speed: 0.42, angle: 5.10, detail: '真实工厂 · 真实价格' }
  ];

  // 竞品平台（更多，散布外围）
  var competitors = [
    // 主要竞品（较大，有标签）
    { label: '阿里巴巴',     tag: '目录平台',     tx: -290, ty: -110, size: 7,  alpha: 0.55, showTag: true  },
    { label: '速卖通',       tag: '低价竞争',     tx:  270, ty: -160, size: 6,  alpha: 0.50, showTag: true  },
    { label: '环球资源',     tag: '展会依赖',     tx: -240, ty:  200, size: 6,  alpha: 0.48, showTag: true  },
    { label: '传统外贸',     tag: '信息不对称',   tx:  210, ty:  220, size: 5.5,alpha: 0.45, showTag: true  },
    // 次要竞品（中等，有标签）
    { label: 'Made-in-China',tag: 'B2B目录',      tx: -180, ty: -230, size: 5,  alpha: 0.38, showTag: true  },
    { label: 'DHgate',       tag: '批发平台',     tx:  320, ty:   60, size: 4.5,alpha: 0.35, showTag: true  },
    { label: 'Faire',        tag: '区域批发',     tx:  160, ty: -260, size: 4.5,alpha: 0.33, showTag: true  },
    { label: 'IndiaMART',    tag: '本地目录',     tx: -320, ty:   80, size: 4,  alpha: 0.30, showTag: true  },
    // 小竞品（仅星点，无标签）
    { label: 'Temu',         tag: '',             tx:  350, ty:  160, size: 3.5,alpha: 0.25, showTag: false },
    { label: 'Shein',        tag: '',             tx: -100, ty: -290, size: 3,  alpha: 0.22, showTag: false },
    { label: 'Wish',         tag: '',             tx:  240, ty: -230, size: 3,  alpha: 0.20, showTag: false },
    { label: 'TradeKey',     tag: '',             tx: -350, ty:  160, size: 3,  alpha: 0.20, showTag: false },
    { label: 'EC21',         tag: '',             tx:   80, ty:  300, size: 2.5,alpha: 0.18, showTag: false },
    { label: 'Kompass',      tag: '',             tx: -200, ty:  280, size: 2.5,alpha: 0.18, showTag: false },
    { label: 'Thomasnet',    tag: '',             tx:  310, ty: -100, size: 2.5,alpha: 0.16, showTag: false },
    { label: 'Alibaba.com',  tag: '',             tx: -260, ty: -180, size: 2,  alpha: 0.15, showTag: false }
  ];

  var BURST_DUR   = 1200;
  var ORBIT_START = 1600;
  var COMP_START  = 2400;
  var t0 = null;
  var lastTs = null;

  // 爆发粒子
  var colorSets = [[79,110,247],[6,182,212],[165,184,255],[255,255,255]];
  var burstPts = [];
  for (var i = 0; i < 120; i++) {
    var a = Math.random() * Math.PI * 2;
    var spd = Math.random() * 5 + 1.5;
    var cs = colorSets[Math.floor(Math.random() * 4)];
    burstPts.push({
      x: CX, y: CY,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 1, decay: 0.007 + Math.random() * 0.014,
      r: Math.random() * 2.5 + 0.5,
      cr: cs[0], cg: cs[1], cb: cs[2]
    });
  }

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  function rgba(hex, a) {
    var c = hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function drawBurst(elapsed) {
    if (elapsed > BURST_DUR * 2) return;
    for (var i = 0; i < burstPts.length; i++) {
      var p = burstPts[i];
      if (p.life <= 0) continue;
      p.x += p.vx * 0.5; p.y += p.vy * 0.5;
      p.life -= p.decay;
      if (p.life <= 0) continue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.cr + ',' + p.cg + ',' + p.cb + ',' + Math.max(0, p.life) + ')';
      ctx.fill();
    }
  }

  function drawCenter(cp, elapsed) {
    var glowR = 52 + Math.sin(elapsed / 900) * 5;
    var g1 = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR * 4);
    g1.addColorStop(0, rgba('#4F6EF7', 0.32 * cp));
    g1.addColorStop(0.45, rgba('#06B6D4', 0.12 * cp));
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath(); ctx.arc(CX, CY, glowR * 4, 0, Math.PI * 2);
    ctx.fillStyle = g1; ctx.fill();
    var pr1 = glowR * 1.7 + Math.sin(elapsed / 550) * 10;
    ctx.beginPath(); ctx.arc(CX, CY, pr1, 0, Math.PI * 2);
    ctx.strokeStyle = rgba('#4F6EF7', 0.22 * cp); ctx.lineWidth = 1.5; ctx.stroke();
    var pr2 = glowR * 2.4 + Math.sin(elapsed / 800 + 1) * 12;
    ctx.beginPath(); ctx.arc(CX, CY, pr2, 0, Math.PI * 2);
    ctx.strokeStyle = rgba('#06B6D4', 0.10 * cp); ctx.lineWidth = 1; ctx.stroke();
    var cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
    cg.addColorStop(0, '#fff');
    cg.addColorStop(0.25, rgba('#A5B8FF', 1));
    cg.addColorStop(0.65, rgba('#4F6EF7', 0.9));
    cg.addColorStop(1, rgba('#4F6EF7', 0));
    ctx.beginPath(); ctx.arc(CX, CY, glowR, 0, Math.PI * 2);
    ctx.fillStyle = cg; ctx.fill();
    if (cp > 0.45) {
      var ta = Math.min(1, (cp - 0.45) * 1.8);
      ctx.save(); ctx.globalAlpha = ta; ctx.textAlign = 'center';
      ctx.font = '900 16px Inter,sans-serif'; ctx.fillStyle = '#fff';
      ctx.fillText('RealSourcing', CX, CY - glowR - 24);
      ctx.font = '500 10px Inter,sans-serif'; ctx.fillStyle = 'rgba(165,184,255,0.8)';
      ctx.fillText('AI-Native Trade OS', CX, CY - glowR - 9);
      ctx.restore();
    }
  }

  function drawOrbits(dt, op) {
    if (op <= 0) return;
    for (var idx = 0; idx < advantages.length; idx++) {
      var adv = advantages[idx];
      var delay = idx * 0.15;
      var p = Math.max(0, Math.min(1, (op - delay) / (1 - delay * 0.6)));
      if (p <= 0) continue;
      // 用 deltaTime 驱动角度，消除瞬移
      adv.angle += adv.speed * dt;
      var ox = CX + adv.r * Math.cos(adv.angle);
      var oy = CY + adv.r * Math.sin(adv.angle);
      // 轨道虚线
      ctx.save();
      ctx.beginPath(); ctx.arc(CX, CY, adv.r, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(adv.color, 0.10 * p);
      ctx.lineWidth = 1; ctx.setLineDash([3, 9]); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      // 彗星拖尾（基于历史角度）
      for (var ti = 1; ti <= 20; ti++) {
        var ta2 = adv.angle - adv.speed * dt * ti * 8;
        var tx2 = CX + adv.r * Math.cos(ta2);
        var ty2 = CY + adv.r * Math.sin(ta2);
        ctx.beginPath(); ctx.arc(tx2, ty2, 3 * (1 - ti / 20), 0, Math.PI * 2);
        ctx.fillStyle = rgba(adv.color, 0.4 * (1 - ti / 20) * p);
        ctx.fill();
      }
      // 节点光晕
      var ng = ctx.createRadialGradient(ox, oy, 0, ox, oy, 30);
      ng.addColorStop(0, rgba(adv.color, 0.45 * p));
      ng.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(ox, oy, 30, 0, Math.PI * 2);
      ctx.fillStyle = ng; ctx.fill();
      // 节点核心
      ctx.beginPath(); ctx.arc(ox, oy, 9, 0, Math.PI * 2);
      ctx.fillStyle = rgba(adv.color, 0.95 * p); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(ox, oy, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
      // 标签
      ctx.save(); ctx.globalAlpha = p;
      var lx = ox + (ox > CX ? 18 : -18);
      var ly = oy;
      ctx.textAlign = ox > CX ? 'left' : 'right';
      ctx.font = '800 15px Inter,"Noto Sans SC",sans-serif';
      ctx.fillStyle = '#fff'; ctx.fillText(adv.label, lx, ly);
      ctx.font = '600 10px Inter,sans-serif';
      ctx.fillStyle = rgba(adv.color, 0.9); ctx.fillText(adv.sub, lx, ly + 14);
      ctx.font = '400 9.5px Inter,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillText(adv.detail, lx, ly + 27);
      ctx.restore();
    }
  }

  function drawCompetitors(elapsed, cp2) {
    if (cp2 <= 0) return;
    for (var idx = 0; idx < competitors.length; idx++) {
      var comp = competitors[idx];
      var delay = idx * 0.06;
      var p = Math.max(0, Math.min(1, (cp2 - delay) / (1 - delay * 0.3)));
      if (p <= 0) continue;
      var finalX = CX + comp.tx, finalY = CY + comp.ty;
      var startX = CX + comp.tx * 2.5, startY = CY + comp.ty * 2.5;
      var cx2 = startX + (finalX - startX) * p;
      var cy2 = startY + (finalY - startY) * p;
      // 微弱光晕
      var ng = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, comp.size * 4);
      ng.addColorStop(0, 'rgba(255,255,255,' + (0.08 * p) + ')');
      ng.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(cx2, cy2, comp.size * 4, 0, Math.PI * 2);
      ctx.fillStyle = ng; ctx.fill();
      // 星体
      ctx.beginPath(); ctx.arc(cx2, cy2, comp.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (comp.alpha * p) + ')'; ctx.fill();
      // 标签（仅主要竞品）
      if (comp.showTag) {
        ctx.save(); ctx.globalAlpha = 0.55 * p; ctx.textAlign = 'center';
        ctx.font = '600 11px Inter,"Noto Sans SC",sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillText(comp.label, cx2, cy2 - comp.size - 8);
        if (comp.tag) {
          ctx.font = '400 9px Inter,sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillText(comp.tag, cx2, cy2 - comp.size + 4);
        }
        ctx.restore();
      }
      // 极淡虚线（仅主要竞品）
      if (comp.showTag) {
        ctx.save();
        ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(cx2, cy2);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.03 * p) + ')';
        ctx.lineWidth = 0.7; ctx.setLineDash([3, 16]); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
      }
    }
  }

  function frame(ts) {
    if (!t0) { t0 = ts; lastTs = ts; }
    var elapsed = ts - t0;
    var dt = Math.min((ts - lastTs) / 1000, 0.05); // deltaTime，最大 50ms 防跳帧
    lastTs = ts;

    ctx.clearRect(0, 0, 1280, 720);
    var burstP  = Math.min(1, elapsed / BURST_DUR);
    var centerP = easeOut(burstP);
    var orbitP  = elapsed > ORBIT_START ? easeOut(Math.min(1, (elapsed - ORBIT_START) / 2200)) : 0;
    var compP   = elapsed > COMP_START  ? easeOut(Math.min(1, (elapsed - COMP_START)  / 3000)) : 0;
    drawBurst(elapsed);
    drawCenter(centerP, elapsed);
    drawOrbits(dt, orbitP);
    drawCompetitors(elapsed, compP);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
