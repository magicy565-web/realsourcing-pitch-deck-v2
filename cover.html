<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSourcing - Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.6; /* Adjust opacity for readability */
        }

        /* Overlay to ensure text readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 15, 0.8) 100%);
            z-index: 1;
        }

        /* Content Container */
        .content {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .logo-text {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #FFFFFF 0%, #A0A0A0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeInDown 1s ease-out forwards 0.5s;
        }

        .subtitle {
            font-size: 1.8rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards 0.8s;
        }

        /* Typewriter Effect Container */
        .typewriter-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem 3rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 1.2s;
            min-width: 500px;
        }

        .typewriter-line {
            font-size: 1.4rem;
            color: #FFFFFF;
            font-family: 'Noto Sans SC', monospace;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid transparent;
            width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .check-icon {
            color: #4F6EF7;
            font-size: 1.2rem;
            opacity: 0;
        }

        /* Typewriter Animations */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: #4F6EF7; }
        }
        
        @keyframes showIcon {
            to { opacity: 1; }
        }

        .line-1 {
            animation: 
                typing 1.5s steps(30, end) forwards 1.5s,
                blink-caret 0.75s step-end infinite;
        }
        .line-1 .check-icon { animation: showIcon 0.1s forwards 1.5s; }

        .line-2 {
            animation: 
                typing 1.5s steps(30, end) forwards 3s,
                blink-caret 0.75s step-end infinite;
        }
        .line-2 .check-icon { animation: showIcon 0.1s forwards 3s; }

        .line-3 {
            animation: 
                typing 1.5s steps(30, end) forwards 4.5s,
                blink-caret 0.75s step-end infinite;
        }
        .line-3 .check-icon { animation: showIcon 0.1s forwards 4.5s; }

        /* Footer Pill */
        .footer-pill {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards 2s;
            z-index: 2;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4F6EF7;
            border-radius: 50%;
            box-shadow: 0 0 10px #4F6EF7;
        }

        /* General Animations */
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
