<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSourcing - Commander Agent 多智能体部署</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        .slide-container { width:1280px; height:720px; position:relative; background:#050510; color:#fff; overflow:hidden; }

        /* Background */
        .video-bg { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0; opacity:0.08; }
        .bg-overlay { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1;
            background: radial-gradient(ellipse 60% 60% at 65% 50%, rgba(139,92,246,0.1) 0%, transparent 70%),
                        linear-gradient(180deg, rgba(5,5,16,0.95) 0%, rgba(5,5,16,0.7) 50%, rgba(5,5,16,0.95) 100%); }
        .grid-lines { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1;
            background-image: linear-gradient(rgba(139,92,246,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(139,92,246,0.03) 1px, transparent 1px);
            background-size:60px 60px; }

        /* Header */
        .header { position:absolute; top:32px; left:80px; z-index:10;
            opacity:0; animation:fadeInDown 0.8s ease-out forwards 0.2s; }
        .main-title { font-size:34px; font-weight:900; letter-spacing:-1px; }
        .title-em { background:linear-gradient(135deg,#8B5CF6,#4F6EF7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .subtitle-tag { font-size:13px; color:rgba(255,255,255,0.4); margin-top:6px; }

        /* Main layout */
        .main-layout { position:absolute; top:110px; left:0; right:0; bottom:20px; z-index:10;
            display:grid; grid-template-columns:380px 1fr; gap:24px; padding:0 60px; align-items:start; }

        /* Left: Code/Log Panel */
        .code-panel { background:rgba(10,10,20,0.9); border:1px solid rgba(139,92,246,0.2);
            border-radius:16px; overflow:hidden; height:560px;
            opacity:0; animation:slideInLeft 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.4s; }
        .code-header { background:rgba(139,92,246,0.08); border-bottom:1px solid rgba(139,92,246,0.15);
            padding:12px 16px; display:flex; align-items:center; gap:8px; }
        .c-dot { width:10px; height:10px; border-radius:50%; }
        .c-dot-r { background:#FF5F57; } .c-dot-y { background:#FFBD2E; } .c-dot-g { background:#28CA41; }
        .c-title { font-size:11px; color:rgba(255,255,255,0.4); margin-left:8px; font-family:'JetBrains Mono',monospace; }
        .code-body { padding:16px; font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.9; overflow:hidden; height:calc(100% - 46px); }

        /* Log line styles */
        .c-line { display:flex; gap:6px; align-items:baseline; min-height:1.9em; }
        .c-ts { color:#3d5066; font-size:10px; flex-shrink:0; }
        .c-tag { font-weight:700; flex-shrink:0; }
        .tag-hunter { color:#4F6EF7; }
        .tag-content { color:#F59E0B; }
        .tag-quote { color:#EF4444; }
        .tag-social { color:#10B981; }
        .tag-system { color:#8B5CF6; }
        .c-text { color:#e2e8f0; }
        .c-ok { color:#10B981; }
        .c-cursor { display:inline-block; width:7px; height:13px; background:#8B5CF6;
            animation:blink 0.8s infinite; vertical-align:middle; margin-left:2px; }
        @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

        /* Right: Video Panel */
        .arch-panel { height:560px; border-radius:16px; overflow:hidden;
            opacity:0; animation:slideInRight 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.6s;
            background:#000; display:flex; align-items:center; justify-content:center; }
        .arch-panel video { width:100%; height:100%; object-fit:cover; }

        .slide-num { position:absolute; bottom:8px; right:40px; font-size:11px;
            color:rgba(255,255,255,0.15); font-family:'JetBrains Mono',monospace; z-index:20; }
        .bottom-bar { position:absolute; bottom:0; left:0; right:0; height:2px; z-index:20;
            background:linear-gradient(90deg,#8B5CF6,#4F6EF7,#10B981); }

        @keyframes fadeInDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideInLeft { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slideInRight { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:translateX(0)} }
    </style>
</head>
<body>
<div class="slide-container">
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://private-us-east-1.manuscdn.com/user_upload_by_module/session_file/310519663384920352/RJVzyHtxRWwdgQPi.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>
    <div class="grid-lines"></div>

    <!-- Header -->
    <div class="header">
        <div class="main-title"><span class="title-em">Commander</span> Agent 多智能体部署</div>
        <div class="subtitle-tag">多 Agent 协同 &middot; 自动化全链路 &middot; 可扩展 &middot; 难以复制</div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Left: Typewriter Log -->
        <div class="code-panel">
            <div class="code-header">
                <div class="c-dot c-dot-r"></div>
                <div class="c-dot c-dot-y"></div>
                <div class="c-dot c-dot-g"></div>
                <span class="c-title">commander-agent-system &middot; task-9527</span>
            </div>
            <div class="code-body" id="logBody"></div>
        </div>

        <!-- Right: Agent Network Video -->
        <div class="arch-panel">
            <video autoplay loop muted playsinline>
                <source src="assets/agent_network.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="bottom-bar"></div>
    <div class="slide-num">07 / 15</div>
</div>

<script>
// ── 日志数据 ──────────────────────────────────────────────
const LOG_ENTRIES = [
    { ts: '14:32:15', tagClass: 'tag-hunter',  tag: '[Hunter Agent]',       text: '正在从欧洲市场上寻找潜在客户...',                         type: 'val' },
    { ts: '14:32:18', tagClass: 'tag-hunter',  tag: '[Hunter Agent]',       text: '找到 12 个潜在客户 ✓',                                    type: 'ok',  delay: 2800 },
    { ts: '14:32:45', tagClass: 'tag-content', tag: '[Content Agent]',      text: '正在为「智能应收箱」发布内容帖...',                       type: 'val', delay: 1600 },
    { ts: '14:33:02', tagClass: 'tag-content', tag: '[Content Agent]',      text: '内容帖已发布到 LinkedIn ✓',                               type: 'ok',  delay: 1400 },
    { ts: '14:33:30', tagClass: 'tag-quote',   tag: '[Quote Agent]',        text: '报价已更新，已发送到日本买家的联系邮箱 ✓',               type: 'ok',  delay: 2200 },
    { ts: '14:34:15', tagClass: 'tag-social',  tag: '[Social Media Agent]', text: '收到来自 Facebook 的新评论，正在根据需求回复内容...',     type: 'val', delay: 1800 },
    { ts: '14:34:42', tagClass: 'tag-social',  tag: '[Social Media Agent]', text: '客户回复已发送 ✓',                                        type: 'ok',  delay: 2400 },
    { ts: '14:35:08', tagClass: 'tag-system',  tag: '[System Agent]',       text: '来自市场采购商的《产品目录》请求已自动发送，标记为已建联客户 ✓', type: 'ok', delay: 2000 },
    { ts: '14:36:10', tagClass: 'tag-hunter',  tag: '[Hunter Agent]',       text: '正在从中东市场上寻找潜在客户...',                         type: 'val', delay: 3200 },
    { ts: '14:36:33', tagClass: 'tag-hunter',  tag: '[Hunter Agent]',       text: '找到 8 个潜在客户 ✓',                                     type: 'ok',  delay: 2600 },
    { ts: '14:37:02', tagClass: 'tag-quote',   tag: '[Quote Agent]',        text: '报价已更新，已发送到英国买家的联系邮箱 ✓',               type: 'ok',  delay: 1900 },
    { ts: '14:37:45', tagClass: 'tag-content', tag: '[Content Agent]',      text: '正在为「会议管理系统」发布内容帖...',                     type: 'val', delay: 2100 },
    { ts: '14:38:12', tagClass: 'tag-content', tag: '[Content Agent]',      text: '内容帖已发布到 Twitter ✓',                                type: 'ok',  delay: 1500 },
    { ts: '14:38:50', tagClass: 'tag-social',  tag: '[Social Media Agent]', text: '收到来自 Instagram 的新评论，正在回复内容...',            type: 'val', delay: 2700 },
    { ts: '14:39:15', tagClass: 'tag-system',  tag: '[System Agent]',       text: '来自美国采购商的《产品目录》请求已自动发送 ✓',           type: 'ok',  delay: 2300 },
];

// ── 打字机引擎 ────────────────────────────────────────────
const logBody = document.getElementById('logBody');
const CHAR_INTERVAL = 38;   // 每字符间隔 ms（稍慢，有质感）
const LINE_GAP_BASE = 600;  // 行间基础间隔 ms

let cursorEl = null;

function createCursor() {
    const c = document.createElement('span');
    c.className = 'c-cursor';
    return c;
}

function typeText(spanEl, text, onDone) {
    let i = 0;
    // 先放光标
    if (cursorEl && cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl);
    cursorEl = createCursor();
    spanEl.appendChild(cursorEl);

    function tick() {
        if (i < text.length) {
            cursorEl.insertAdjacentText('beforebegin', text[i]);
            i++;
            setTimeout(tick, CHAR_INTERVAL + Math.random() * 18 - 9);
        } else {
            if (onDone) onDone();
        }
    }
    tick();
}

function appendLine(entry, onDone) {
    const line = document.createElement('div');
    line.className = 'c-line';

    const tsEl = document.createElement('span');
    tsEl.className = 'c-ts';
    tsEl.textContent = entry.ts;

    const tagEl = document.createElement('span');
    tagEl.className = 'c-tag ' + entry.tagClass;
    tagEl.textContent = entry.tag;

    const textEl = document.createElement('span');
    textEl.className = entry.type === 'ok' ? 'c-ok' : 'c-text';

    line.appendChild(tsEl);
    line.appendChild(tagEl);
    line.appendChild(textEl);
    logBody.appendChild(line);

    // 自动滚动到底部
    logBody.scrollTop = logBody.scrollHeight;

    typeText(textEl, entry.text, onDone);
}

function runLog(index) {
    if (index >= LOG_ENTRIES.length) {
        // 全部完成后，光标停在最后
        return;
    }
    const entry = LOG_ENTRIES[index];
    const delay = index === 0 ? 800 : (entry.delay || LINE_GAP_BASE + Math.random() * 800);

    setTimeout(() => {
        appendLine(entry, () => {
            // 打完这行后，等待一段"执行延迟"再打下一行
            const execDelay = 400 + Math.random() * 600;
            setTimeout(() => runLog(index + 1), execDelay);
        });
    }, delay);
}

// 页面加载后延迟启动
setTimeout(() => runLog(0), 1200);
</script>
</body>
</html>
