<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSourcing - Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            padding: 40px 80px;
            display: flex;
            flex-direction: column;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.4;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 15, 0.9) 100%);
            z-index: 1;
        }

        .header {
            z-index: 2;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .section-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4F6EF7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        .content-wrapper {
            display: flex;
            gap: 60px;
            z-index: 2;
            flex: 1;
            align-items: center;
            justify-content: center;
        }

        .circles-container {
            position: relative;
            width: 420px;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-weight: 700;
            opacity: 0;
        }

        .circle-tam {
            width: 380px;
            height: 380px;
            border: 2px solid rgba(79, 110, 247, 0.3);
            animation: fadeInScale 1s ease-out forwards 0.3s;
        }

        .circle-tam::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: #4F6EF7;
            border-right-color: #4F6EF7;
            border-radius: 50%;
            animation: shimmerFlow 3s linear infinite;
        }

        .circle-sam {
            width: 280px;
            height: 280px;
            border: 2px solid rgba(142, 68, 173, 0.3);
            animation: fadeInScale 1s ease-out forwards 0.5s;
        }

        .circle-sam::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: #8E44AD;
            border-right-color: #8E44AD;
            border-radius: 50%;
            animation: shimmerFlow 3s linear infinite 0.5s;
        }

        .circle-som {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, rgba(79, 110, 247, 0.15), rgba(142, 68, 173, 0.15));
            border: 2px solid rgba(79, 110, 247, 0.5);
            animation: fadeInScale 1s ease-out forwards 0.7s;
        }

        .circle-som::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: #2ECC71;
            border-right-color: #2ECC71;
            border-radius: 50%;
            animation: shimmerFlow 3s linear infinite 1s;
        }

        @keyframes shimmerFlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .circle-label {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .label-title {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #FFF;
        }

        .label-value {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #FFF, #CCC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .label-desc {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            opacity: 0;
            transform: translateX(20px);
        }

        .card-1 { animation: slideInRight 0.8s ease-out forwards 0.4s; }
        .card-2 { animation: slideInRight 0.8s ease-out forwards 0.6s; }
        .card-3 { animation: slideInRight 0.8s ease-out forwards 0.8s; }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #FFF;
        }

        .card-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .card-1 .card-icon { color: #4F6EF7; }
        .card-2 .card-icon { color: #8E44AD; }
        .card-3 .card-icon { color: #2ECC71; }

        .card-text {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { to { opacity: 1; transform: scale(1); } }
        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }

    </style>
</head>
