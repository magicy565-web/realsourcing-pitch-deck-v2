<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSourcing - 平台全景</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            background: #0A0A0F;
        }
        /* Background Video Layer */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.1;
            mix-blend-mode: screen;
        }

        /* Central Hub */
        .hub-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2), rgba(0,0,0,0.8));
            border: 1px solid rgba(139, 92, 246, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.3);
            animation: pulseHub 4s infinite;
        }

        @keyframes pulseHub {
            0% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.2); }
            50% { box-shadow: 0 0 80px rgba(139, 92, 246, 0.5); }
            100% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.2); }
        }

        /* Side Panels */
        .side-panel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            z-index: 10;
        }

        .left-panel { left: 80px; border-left: 4px solid #3B82F6; }
        .right-panel { right: 80px; border-right: 4px solid #10B981; text-align: right; }

        /* Connecting Lines */
        .connector {
            position: absolute;
            top: 50%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 5;
        }
        
        .connector-left { left: 400px; width: 160px; }
        .connector-right { right: 400px; width: 160px; }

        /* Data Particles */
        .particle {
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            z-index: 6;
            margin-top: -4px;
        }

        .particle-left {
            left: 400px;
            background: #3B82F6;
            animation: flowRight 2s infinite linear;
        }

        .particle-right {
            right: 400px;
            background: #10B981;
            animation: flowLeft 2s infinite linear;
        }

        @keyframes flowRight {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(160px); opacity: 0; }
        }

        @keyframes flowLeft {
            0% { transform: translateX(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(-160px); opacity: 0; }
        }

        /* Feature List */
        .feature-item {
            margin-top: 12px;
            font-size: 14px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .right-panel .feature-item {
            justify-content: flex-end;
        }

        /* Bottom Layer */
        .trust-layer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            text-align: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 1s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>

        <!-- Center Hub -->

            <div class="text-xl font-bold text-white">RealSourcing</div>

        <!-- Connectors & Particles -->
        <div class="connector connector-left"></div>

        <div class="particle particle-left"></div>

        <div class="particle particle-right"></div>
        <div class="particle particle-right" style="animation-delay: 1s;"></div>

        <!-- Bottom Trust Layer -->
        <div class="trust-layer fade-in" style="animation-delay: 0.6s;">

                <span class="flex items-center gap-2"><span class="w-2 h-2 bg-gray-500 rounded-full"></span> 资金托管保障</span>
                <span class="flex items-center gap-2"><span class="w-2 h-2 bg-gray-500 rounded-full"></span> 实地验厂报告</span>
