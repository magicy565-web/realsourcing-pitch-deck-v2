<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RealSourcing - Slide 09</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── Hard lock to 1280×720, no scroll ── */
html, body {
  width:1280px; height:720px;
  overflow:hidden; margin:0; padding:0;
  background:#050510;
  font-family:'Inter','Noto Sans SC',sans-serif;
}

.slide {
  width:1280px; height:720px;
  position:relative; overflow:hidden;
  background:#050510; color:#fff;
}

/* ── Background ── */
.bg-glow {
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 70% 80% at 72% 50%, rgba(79,110,247,0.14) 0%, transparent 60%),
    radial-gradient(ellipse 45% 50% at 18% 40%, rgba(124,58,237,0.09) 0%, transparent 55%),
    radial-gradient(ellipse 30% 30% at 50% 90%, rgba(16,185,129,0.05) 0%, transparent 60%);
}
.grid-bg {
  position:absolute; inset:0; z-index:0;
  background-image:
    linear-gradient(rgba(79,110,247,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,110,247,0.025) 1px, transparent 1px);
  background-size:55px 55px;
}

/* ── Left Panel ── */
.left-panel {
  position:absolute;
  left:44px; top:50%;
  transform:translateY(-50%);
  width:230px; z-index:20;
  opacity:0;
  animation:slideInLeft 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.3s;
}
@keyframes slideInLeft {
  from { opacity:0; transform:translate(-24px,-50%); }
  to   { opacity:1; transform:translate(0,-50%); }
}

.section-tag {
  font-size:9px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
  color:#4F6EF7; margin-bottom:12px;
  display:flex; align-items:center; gap:7px;
}
.section-tag::before {
  content:''; width:18px; height:2px;
  background:linear-gradient(90deg,#4F6EF7,#8B5CF6); flex-shrink:0;
}
.main-title {
  font-size:28px; font-weight:900; line-height:1.18; letter-spacing:-0.8px;
  margin-bottom:12px;
}
.title-em {
  background:linear-gradient(135deg,#4F6EF7,#8B5CF6,#10B981);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.desc {
  font-size:11.5px; color:rgba(255,255,255,0.45); line-height:1.65;
  margin-bottom:18px;
}

.badge-row { display:flex; flex-direction:column; gap:8px; }
.badge-item {
  display:flex; align-items:center; gap:8px;
  font-size:11px; color:rgba(255,255,255,0.5);
}
.badge-dot {
  width:6px; height:6px; border-radius:50%; flex-shrink:0;
}

/* ── 3D Browser ── */
.scene {
  position:absolute;
  /* Center the browser in the right 2/3 of the slide */
  left:310px; top:50%;
  transform:translateY(-50%);
  width:940px;
  z-index:10;
  perspective:1400px;
}

.browser-3d {
  width:100%;
  transform: rotateY(-22deg) rotateX(6deg) rotateZ(-1deg);
  transform-style:preserve-3d;
  transform-origin:center center;
  border-radius:14px;
  /* Deep dramatic shadow */
  box-shadow:
    -40px 30px 80px rgba(0,0,0,0.8),
    -20px 15px 40px rgba(79,110,247,0.25),
    0 0 0 1px rgba(255,255,255,0.1),
    inset 0 1px 0 rgba(255,255,255,0.12);
  opacity:0;
  animation:
    floatIn 1.1s cubic-bezier(0.16,1,0.3,1) forwards 0.5s,
    floatBob 7s ease-in-out infinite 1.7s;
}
@keyframes floatIn {
  from {
    opacity:0;
    transform:rotateY(-38deg) rotateX(10deg) rotateZ(-2deg) translateX(80px);
  }
  to {
    opacity:1;
    transform:rotateY(-22deg) rotateX(6deg) rotateZ(-1deg) translateX(0);
  }
}
@keyframes floatBob {
  0%,100% { transform:rotateY(-22deg) rotateX(6deg) rotateZ(-1deg) translateY(0px); }
  50%      { transform:rotateY(-22deg) rotateX(6deg) rotateZ(-1deg) translateY(-10px); }
}

/* macOS Chrome */
.mac-chrome {
  background:linear-gradient(180deg,#323236 0%,#28282C 100%);
  border-radius:14px 14px 0 0;
  padding:9px 14px 7px;
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(0,0,0,0.4);
}
.traffic-lights { display:flex; gap:6px; align-items:center; flex-shrink:0; }
.tl { width:12px; height:12px; border-radius:50%; }
.tl-r { background:#FF5F57; box-shadow:0 0 5px rgba(255,95,87,0.7); }
.tl-y { background:#FEBC2E; box-shadow:0 0 5px rgba(254,188,46,0.7); }
.tl-g { background:#28C840; box-shadow:0 0 5px rgba(40,200,64,0.7); }

.chrome-toolbar { flex:1; display:flex; align-items:center; gap:7px; }
.nav-btn {
  width:22px; height:22px; border-radius:5px;
  background:rgba(255,255,255,0.07); border:none;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; color:rgba(255,255,255,0.35); cursor:default;
}
.address-bar {
  flex:1; height:25px; border-radius:6px;
  background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; gap:5px; padding:0 10px;
  font-size:10.5px;
}
.lock { font-size:9px; color:#28C840; }
.url  { color:rgba(255,255,255,0.5); }
.url b { color:rgba(255,255,255,0.85); font-weight:600; }
.chrome-btns { display:flex; gap:5px; }
.c-btn {
  width:22px; height:22px; border-radius:5px;
  background:rgba(255,255,255,0.06);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; color:rgba(255,255,255,0.35);
}

/* Tab bar */
.tab-bar {
  background:#1E1E22;
  padding:0 14px;
  display:flex; align-items:flex-end; gap:2px;
  border-bottom:1px solid rgba(0,0,0,0.5);
}
.tab {
  padding:5px 14px 4px; border-radius:7px 7px 0 0;
  font-size:10px; color:rgba(255,255,255,0.38);
  display:flex; align-items:center; gap:5px; cursor:default;
}
.tab.active {
  background:#0F0F14; color:rgba(255,255,255,0.82);
  border:1px solid rgba(255,255,255,0.09); border-bottom:1px solid #0F0F14;
}

/* Screenshot */
.browser-body {
  background:#0F0F14;
  border-radius:0 0 14px 14px;
  overflow:hidden;
  position:relative;
  /* Clip to show only the visible portion of the screenshot */
  max-height:530px;
}
.browser-body img {
  width:100%; display:block;
  border-radius:0 0 14px 14px;
}
/* Glossy reflection */
.gloss {
  position:absolute; top:0; left:0; right:0; height:35%;
  background:linear-gradient(180deg,rgba(255,255,255,0.05) 0%,transparent 100%);
  pointer-events:none; z-index:3;
}
/* Bottom fade so it doesn't hard-clip */
.fade-bottom {
  position:absolute; bottom:0; left:0; right:0; height:80px;
  background:linear-gradient(0deg,#050510 0%,transparent 100%);
  pointer-events:none; z-index:4;
}

/* ── Edge glow behind browser ── */
.browser-glow {
  position:absolute;
  left:320px; top:50%; transform:translateY(-50%);
  width:900px; height:500px;
  background:radial-gradient(ellipse 60% 70% at 55% 50%, rgba(79,110,247,0.18) 0%, transparent 70%);
  z-index:5; pointer-events:none;
  filter:blur(30px);
}

/* ── Accent dots ── */
.dot {
  position:absolute; border-radius:50%; z-index:15;
  animation:pulseDot 3s ease-in-out infinite;
}
@keyframes pulseDot {
  0%,100%{transform:scale(1);opacity:0.7}
  50%{transform:scale(1.4);opacity:1}
}

/* ── Bottom bar ── */
.bottom-bar {
  position:absolute; bottom:0; left:0; right:0; height:2px; z-index:30;
  background:linear-gradient(90deg,#4F6EF7,#8B5CF6,#10B981);
}
.slide-num {
  position:absolute; bottom:8px; right:36px;
  font-size:10px; color:rgba(255,255,255,0.15);
  font-family:'JetBrains Mono',monospace; z-index:30;
}
</style>
</head>
<body>
<div class="slide">
  <div class="bg-glow"></div>
  <div class="grid-bg"></div>

  <!-- Glow behind browser -->
  <div class="browser-glow"></div>

  <!-- Accent dots -->
  <div class="dot" style="width:5px;height:5px;background:#4F6EF7;box-shadow:0 0 10px #4F6EF7;top:108px;left:316px;animation-delay:0s;"></div>
  <div class="dot" style="width:4px;height:4px;background:#10B981;box-shadow:0 0 9px #10B981;top:590px;left:295px;animation-delay:1.3s;"></div>
  <div class="dot" style="width:4px;height:4px;background:#8B5CF6;box-shadow:0 0 9px #8B5CF6;top:185px;left:340px;animation-delay:2.2s;"></div>

  <!-- ── Left Panel ── -->
  <div class="left-panel">
    <div class="section-tag">Platform Demo &middot; 平台演示</div>
    <div class="main-title">
      一站式<br>
      <span class="title-em">智能采购</span><br>
      操作台
    </div>
    <div class="desc">
      整合全球工厂资源、AI 智能助理与实时沟通工具，让采购决策更快、更准、更安全。
    </div>

    <div class="badge-row">
      <div class="badge-item"><div class="badge-dot" style="background:#4F6EF7;box-shadow:0 0 6px #4F6EF7"></div>Webinar 直播 · AI 采购助理</div>
      <div class="badge-item"><div class="badge-dot" style="background:#10B981;box-shadow:0 0 6px #10B981"></div>2,500+ 认证工厂 · 50+ 品类</div>
      <div class="badge-item"><div class="badge-dot" style="background:#8B5CF6;box-shadow:0 0 6px #8B5CF6"></div>视频会议直连 · 样品快速下单</div>
    </div>
  </div>

  <!-- ── 3D Browser ── -->
  <div class="scene">
    <div class="browser-3d">
      <!-- macOS Chrome -->
      <div class="mac-chrome">
        <div class="traffic-lights">
          <div class="tl tl-r"></div>
          <div class="tl tl-y"></div>
          <div class="tl tl-g"></div>
        </div>
        <div class="chrome-toolbar">
          <div class="nav-btn">‹</div>
          <div class="nav-btn">›</div>
          <div class="address-bar">
            <span class="lock">🔒</span>
            <span class="url">app.<b>realsourcing.com</b>/dashboard</span>
          </div>
        </div>
        <div class="chrome-btns">
          <div class="c-btn">↻</div>
          <div class="c-btn">⊕</div>
          <div class="c-btn">⋯</div>
        </div>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <div class="tab active">
          <span>🌐</span> RealSourcing Dashboard
        </div>
        <div class="tab"><span>📋</span> Factories</div>
        <div class="tab" style="padding:5px 8px 4px">+</div>
      </div>

      <!-- Dashboard screenshot -->
      <div class="browser-body">
        <img loading="lazy" decoding="async" src="assets/dashboard_screenshot.png" alt="RealSourcing Dashboard">
        <div class="gloss"></div>
        <div class="fade-bottom"></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar"></div>
  <div class="slide-num">09 / 16</div>
</div>
</body>
</html>
