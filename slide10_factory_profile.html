<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RealSourcing - Slide 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html, body {
  width:1280px; height:720px;
  overflow:hidden; margin:0; padding:0;
  background:#050510;
  font-family:'Inter','Noto Sans SC',sans-serif;
}
.slide {
  width:1280px; height:720px;
  position:relative; overflow:hidden;
  background:#050510; color:#fff;
}

/* ── Background ── */
.bg-glow {
  position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 55% 70% at 75% 50%, rgba(79,110,247,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 40% 50% at 15% 45%, rgba(124,58,237,0.09) 0%, transparent 55%),
    radial-gradient(ellipse 30% 30% at 50% 100%, rgba(16,185,129,0.06) 0%, transparent 55%);
}
.grid-bg {
  position:absolute; inset:0; z-index:0;
  background-image:
    linear-gradient(rgba(79,110,247,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,110,247,0.025) 1px, transparent 1px);
  background-size:55px 55px;
}

/* ── Left Panel ── */
.left-panel {
  position:absolute;
  left:52px; top:50%;
  transform:translateY(-50%);
  width:310px; z-index:20;
  opacity:0;
  animation:slideInLeft 0.9s cubic-bezier(0.16,1,0.3,1) forwards 0.3s;
}
@keyframes slideInLeft {
  from { opacity:0; transform:translate(-28px,-50%); }
  to   { opacity:1; transform:translate(0,-50%); }
}

.section-tag {
  font-size:9px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
  color:#4F6EF7; margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.section-tag::before {
  content:''; width:18px; height:2px;
  background:linear-gradient(90deg,#4F6EF7,#8B5CF6); flex-shrink:0;
}

.main-title {
  font-size:30px; font-weight:900; line-height:1.2; letter-spacing:-0.8px;
  margin-bottom:10px;
}
.title-em {
  background:linear-gradient(135deg,#4F6EF7,#8B5CF6,#10B981);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.subtitle {
  font-size:13px; color:rgba(255,255,255,0.45); line-height:1.6; margin-bottom:24px;
}

/* Cost comparison */
.cost-compare {
  display:flex; align-items:stretch; gap:12px; margin-bottom:24px;
}
.cost-box {
  flex:1; border-radius:12px; padding:14px 14px 12px;
  display:flex; flex-direction:column; gap:4px;
  position:relative; overflow:hidden;
}
.cost-box.old {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
}
.cost-box.new {
  background:linear-gradient(135deg,rgba(79,110,247,0.18),rgba(16,185,129,0.12));
  border:1px solid rgba(79,110,247,0.35);
}
.cost-label { font-size:9.5px; color:rgba(255,255,255,0.4); font-weight:600; letter-spacing:1px; text-transform:uppercase; }
.cost-amount { font-size:22px; font-weight:900; }
.cost-box.old .cost-amount { color:rgba(255,255,255,0.35); text-decoration:line-through; }
.cost-box.new .cost-amount { color:#10B981; }
.cost-desc { font-size:9.5px; color:rgba(255,255,255,0.35); }
.cost-box.new .cost-desc { color:rgba(16,185,129,0.7); }
.cost-badge {
  position:absolute; top:8px; right:8px;
  background:linear-gradient(135deg,#4F6EF7,#8B5CF6);
  color:#fff; font-size:8px; font-weight:800; padding:2px 7px; border-radius:20px;
  letter-spacing:0.5px;
}
.vs-divider {
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:rgba(255,255,255,0.25);
  flex-shrink:0; width:24px;
}

/* Feature bullets */
.feature-list { display:flex; flex-direction:column; gap:9px; margin-bottom:20px; }
.feature-row {
  display:flex; align-items:flex-start; gap:10px;
}
.f-icon {
  width:30px; height:30px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
.f-blue   { background:rgba(79,110,247,0.18); }
.f-green  { background:rgba(16,185,129,0.18); }
.f-purple { background:rgba(124,58,237,0.18); }
.f-title  { font-size:11.5px; font-weight:700; color:#fff; margin-bottom:2px; }
.f-sub    { font-size:10px; color:rgba(255,255,255,0.4); line-height:1.4; }

/* CTA */
.cta-row { display:flex; gap:10px; }
.cta-btn {
  flex:1; padding:10px 0; border-radius:10px; text-align:center;
  font-size:11px; font-weight:700; cursor:default;
}
.cta-primary {
  background:linear-gradient(135deg,#4F6EF7,#8B5CF6);
  color:#fff;
}
.cta-secondary {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.6);
}

/* ── Right: Dual 3D screens ── */
.screens-wrap {
  position:absolute;
  right:0; top:50%;
  transform:translateY(-50%);
  width:820px; height:680px;
  z-index:10;
  opacity:0;
  animation:screensIn 1.1s cubic-bezier(0.16,1,0.3,1) forwards 0.5s;
}
@keyframes screensIn {
  from { opacity:0; transform:translateY(-50%) translateX(60px); }
  to   { opacity:1; transform:translateY(-50%) translateX(0); }
}

/* Detail page (browser, left, larger) */
.screen-detail {
  position:absolute;
  left:30px; top:50%;
  transform:translateY(-50%) perspective(1200px) rotateY(-16deg) rotateX(4deg);
  width:500px;
  border-radius:16px;
  box-shadow:
    -30px 25px 70px rgba(0,0,0,0.75),
    -15px 10px 35px rgba(79,110,247,0.2),
    0 0 0 1px rgba(255,255,255,0.1),
    inset 0 1px 0 rgba(255,255,255,0.1);
  animation: floatBobA 7s ease-in-out infinite 1.6s;
}
@keyframes floatBobA {
  0%,100% { transform:translateY(-50%) perspective(1200px) rotateY(-16deg) rotateX(4deg) translateY(0); }
  50%      { transform:translateY(-50%) perspective(1200px) rotateY(-16deg) rotateX(4deg) translateY(-8px); }
}

/* Card (phone, right, smaller, overlapping) */
.screen-card {
  position:absolute;
  right:10px; top:50%;
  transform:translateY(-50%) perspective(900px) rotateY(8deg) rotateX(-3deg);
  width:230px;
  border-radius:28px;
  box-shadow:
    20px 30px 60px rgba(0,0,0,0.8),
    10px 10px 30px rgba(124,58,237,0.25),
    0 0 0 1px rgba(255,255,255,0.12),
    inset 0 1px 0 rgba(255,255,255,0.12);
  z-index:5;
  animation: floatBobB 7s ease-in-out infinite 2.2s;
}
@keyframes floatBobB {
  0%,100% { transform:translateY(-50%) perspective(900px) rotateY(8deg) rotateX(-3deg) translateY(0); }
  50%      { transform:translateY(-50%) perspective(900px) rotateY(8deg) rotateX(-3deg) translateY(-12px); }
}

/* macOS browser chrome */
.mac-chrome {
  background:linear-gradient(180deg,#323236 0%,#28282C 100%);
  border-radius:16px 16px 0 0;
  padding:9px 14px 7px;
  display:flex; align-items:center; gap:10px;
}
.tls { display:flex; gap:5px; align-items:center; }
.tl { width:11px; height:11px; border-radius:50%; }
.tl-r { background:#FF5F57; box-shadow:0 0 4px rgba(255,95,87,0.7); }
.tl-y { background:#FEBC2E; box-shadow:0 0 4px rgba(254,188,46,0.7); }
.tl-g { background:#28C840; box-shadow:0 0 4px rgba(40,200,64,0.7); }
.address-bar {
  flex:1; height:22px; border-radius:5px;
  background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.1);
  display:flex; align-items:center; gap:5px; padding:0 8px;
  font-size:9.5px; color:rgba(255,255,255,0.5);
}
.lock { font-size:8px; color:#28C840; }
.url b { color:rgba(255,255,255,0.8); font-weight:600; }

/* Phone chrome */
.phone-chrome {
  background:linear-gradient(180deg,#1A1A22 0%,#14141C 100%);
  border-radius:28px 28px 0 0;
  padding:14px 14px 0;
  display:flex; justify-content:center;
}
.phone-notch {
  width:80px; height:20px; background:#0A0A12;
  border-radius:0 0 14px 14px;
}

/* Screen bodies */
.screen-body {
  background:#0F0F18;
  overflow:hidden;
  position:relative;
}
.screen-body.detail-body {
  border-radius:0 0 16px 16px;
  max-height:480px;
}
.screen-body.card-body {
  border-radius:0 0 28px 28px;
  max-height:560px;
}
.screen-body img {
  width:100%; display:block;
}
.gloss {
  position:absolute; top:0; left:0; right:0; height:30%;
  background:linear-gradient(180deg,rgba(255,255,255,0.05) 0%,transparent 100%);
  pointer-events:none; z-index:3;
}
.fade-btm {
  position:absolute; bottom:0; left:0; right:0; height:60px;
  background:linear-gradient(0deg,#050510 0%,transparent 100%);
  pointer-events:none; z-index:4;
}

/* AI search floating badge */
.ai-badge {
  position:absolute;
  top:140px; left:340px;
  background:linear-gradient(135deg,rgba(79,110,247,0.9),rgba(124,58,237,0.9));
  border:1px solid rgba(255,255,255,0.2);
  border-radius:12px; padding:8px 14px;
  display:flex; align-items:center; gap:8px;
  font-size:11px; font-weight:600; color:#fff;
  box-shadow:0 8px 30px rgba(79,110,247,0.4);
  z-index:20;
  opacity:0;
  animation:badgeIn 0.6s ease forwards 1.4s, badgePulse 3s ease-in-out infinite 2s;
}
@keyframes badgeIn {
  from { opacity:0; transform:scale(0.8) translateY(10px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
@keyframes badgePulse {
  0%,100% { box-shadow:0 8px 30px rgba(79,110,247,0.4); }
  50%      { box-shadow:0 8px 40px rgba(79,110,247,0.7); }
}
.ai-dot {
  width:8px; height:8px; border-radius:50%;
  background:#10B981; box-shadow:0 0 8px #10B981;
  animation:dotBlink 1.5s ease-in-out infinite;
}
@keyframes dotBlink {
  0%,100% { opacity:1; } 50% { opacity:0.3; }
}

/* Connecting line */
.connect-line {
  position:absolute;
  top:0; left:0; right:0; bottom:0;
  pointer-events:none; z-index:6;
}

/* ── Bottom bar ── */
.bottom-bar {
  position:absolute; bottom:0; left:0; right:0; height:2px; z-index:30;
  background:linear-gradient(90deg,#4F6EF7,#8B5CF6,#10B981);
}
.slide-num {
  position:absolute; bottom:8px; right:36px;
  font-size:10px; color:rgba(255,255,255,0.15);
  font-family:'JetBrains Mono',monospace; z-index:30;
}

/* Accent dots */
.dot {
  position:absolute; border-radius:50%; z-index:15;
  animation:pulseDot 3s ease-in-out infinite;
}
@keyframes pulseDot {
  0%,100%{transform:scale(1);opacity:0.7}
  50%{transform:scale(1.4);opacity:1}
}

    /* === 全局性能优化 === */
    /* 动画元素 GPU 加速 */
    [class*="anim"], [class*="fade"], [class*="slide-in"],
    [class*="float"], [class*="pulse"], [class*="glow"],
    [class*="spin"], [class*="rotate"], [class*="bounce"],
    .card, .metric-card, .track-card, .stat-box,
    .nav-dot, .timeline-node {
        will-change: transform, opacity;
        transform: translateZ(0);
    }
    /* 视频容器 GPU 加速 */
    video { transform: translateZ(0); }
    /* 减少字体渲染开销 */
    body { text-rendering: optimizeSpeed; -webkit-font-smoothing: antialiased; }

    </style>
</head>
<body>
<div class="slide">
  <div class="bg-glow"></div>
  <div class="grid-bg"></div>

  <!-- Accent dots -->
  <div class="dot" style="width:5px;height:5px;background:#4F6EF7;box-shadow:0 0 10px #4F6EF7;top:110px;left:380px;animation-delay:0s;"></div>
  <div class="dot" style="width:4px;height:4px;background:#10B981;box-shadow:0 0 9px #10B981;top:600px;left:360px;animation-delay:1.4s;"></div>

  <!-- ── Left Panel ── -->
  <div class="left-panel">
    <div class="section-tag">Factory AI Profile &middot; 工厂 AI 档案</div>

    <div class="main-title">
      让工厂被<br>
      <span class="title-em">AI 检索收录</span><br>
      成本仅 1/20
    </div>
    <div class="subtitle">
      工厂信息结构化入驻平台，可被全球买家与 AI Agent 精准检索，<br>
      开通成本仅为传统建站的 <strong style="color:#10B981;font-weight:900;">1/20</strong>。
    </div>
  </div>

  <!-- ── Right: Dual 3D Screens ── -->
  <div class="screens-wrap">

    <!-- Detail page (browser) -->
    <div class="screen-detail">
      <div class="mac-chrome">
        <div class="tls">
          <div class="tl tl-r"></div>
          <div class="tl tl-y"></div>
          <div class="tl tl-g"></div>
        </div>
        <div class="address-bar">
          <span class="lock">🔒</span>
          <span class="url">app.<b>realsourcing.com</b>/factories/kabeq</span>
        </div>
      </div>
      <div class="screen-body detail-body">
        <img loading="lazy" decoding="async" src="assets/factory_detail.png" alt="Factory Detail">
        <div class="gloss"></div>
        <div class="fade-btm"></div>
      </div>
    </div>

    <!-- Card (phone) -->
    <div class="screen-card">
      <div class="phone-chrome">
        <div class="phone-notch"></div>
      </div>
      <div class="screen-body card-body">
        <img loading="lazy" decoding="async" src="assets/factory_card.png" alt="Factory Card">
        <div class="gloss"></div>
        <div class="fade-btm"></div>
      </div>
    </div>


  </div>

  <div class="bottom-bar"></div>
  <div class="slide-num">10 / 16</div>
</div>
</body>
</html>
