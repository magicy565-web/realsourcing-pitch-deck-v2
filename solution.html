<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealSourcing - Solution</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            padding: 40px 80px;
            display: flex;
            flex-direction: column;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.4;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 15, 0.9) 100%);
            z-index: 1;
        }

        .header {
            z-index: 2;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
            text-align: center;
        }
        
        .section-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4F6EF7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1.2;
            background: linear-gradient(90deg, #FFF, #A0A0A0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            z-index: 2;
            margin-bottom: 40px;
            justify-content: center;
            flex: 1;
            align-items: center;
        }

        .feature-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            overflow: hidden;
            min-height: 320px;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4F6EF7, #8E44AD);
            opacity: 0.8;
        }

        .feature-card:nth-child(1) { animation: fadeInUp 0.8s ease-out forwards 0.2s; }
        .feature-card:nth-child(2) { animation: fadeInUp 0.8s ease-out forwards 0.4s; }
        .feature-card:nth-child(3) { animation: fadeInUp 0.8s ease-out forwards 0.6s; }

        .card-icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(79, 110, 247, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #4F6EF7;
            box-shadow: 0 0 20px rgba(79, 110, 247, 0.2);
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #FFF;
        }

        .card-text {
            font-size: 1rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.7);
        }

        .comparison-bar {
            z-index: 2;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 1s;
            margin-top: auto;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .timeline-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
        }

        .highlight-speed {
            color: #2ECC71;
            font-weight: 700;
        }

        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>

        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
