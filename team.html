    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            padding: 40px 80px;
            display: flex;
            flex-direction: column;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.4;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 15, 0.9) 100%);
            z-index: 1;
        }

        .header {
            z-index: 2;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .section-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4F6EF7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            z-index: 2;
            flex: 1;
            align-items: center;
        }

        /* Left: Founder */
        .founder-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInLeft 0.8s ease-out forwards 0.2s;
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4F6EF7, #8E44AD);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #FFF;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(79, 110, 247, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.1);
        }

        .founder-name { font-size: 2rem; font-weight: 700; margin-bottom: 5px; }
        .founder-role { font-size: 1rem; color: #4F6EF7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; font-weight: 600; }
        .founder-quote { font-size: 1rem; line-height: 1.6; color: rgba(255, 255, 255, 0.8); font-style: italic; background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 16px; border-left: 3px solid #4F6EF7; }

        /* Right: Ecosystem */
        .ecosystem-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .eco-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            opacity: 0;
            transform: translateY(20px);
        }

        .eco-card:nth-child(1) { animation: fadeInUp 0.6s ease-out forwards 0.4s; }
        .eco-card:nth-child(2) { animation: fadeInUp 0.6s ease-out forwards 0.6s; }
        .eco-card:nth-child(3) { animation: fadeInUp 0.6s ease-out forwards 0.8s; }
        .eco-card:nth-child(4) { animation: fadeInUp 0.6s ease-out forwards 1.0s; }

        .eco-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #FFF;
            margin-bottom: 15px;
        }

        .eco-title { font-size: 1.1rem; font-weight: 600; color: #FFF; margin-bottom: 5px; }
        .eco-desc { font-size: 0.9rem; color: rgba(255, 255, 255, 0.6); line-height: 1.4; }

        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { to { opacity: 1; transform: translateX(0); } }

    </style>
</head>

<script>
// 背景视频延迟加载：页面渲染完成后再加载视频
(function(){
  function loadBgVideos(){
    document.querySelectorAll('video[data-autoplay]').forEach(function(v){
      // 找到 source 子元素并赋值 src
      var src = v.querySelector('source');
      if(src && src.getAttribute('data-src')){
        src.src = src.getAttribute('data-src');
        src.removeAttribute('data-src');
      }
      v.load();
      v.play().catch(function(){});
    });
  }
  if(document.readyState === 'complete'){
    setTimeout(loadBgVideos, 300);
  } else {
    window.addEventListener('load', function(){ setTimeout(loadBgVideos, 300); });
  }
})();
</script>
