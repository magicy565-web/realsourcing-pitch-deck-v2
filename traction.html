    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            padding: 40px 80px;
            display: flex;
            flex-direction: column;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.4;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 10, 15, 0.9) 100%);
            z-index: 1;
        }

        .header {
            z-index: 2;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInDown 0.8s ease-out forwards;
        }
        
        .section-tag {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4F6EF7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            z-index: 2;
            flex: 1;
            align-items: center;
        }

        /* Left: Key Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
        }

        .metric-card:nth-child(1) { animation: fadeInUp 0.6s ease-out forwards 0.2s; }
        .metric-card:nth-child(2) { animation: fadeInUp 0.6s ease-out forwards 0.4s; }
        .metric-card:nth-child(3) { animation: fadeInUp 0.6s ease-out forwards 0.6s; }
        .metric-card:nth-child(4) { animation: fadeInUp 0.6s ease-out forwards 0.8s; }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #FFF;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #FFF, #CCC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .metric-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-sub {
            font-size: 0.8rem;
            color: #4F6EF7;
            margin-top: 5px;
        }

        /* Right: Case Study */
        .case-study {
            background: linear-gradient(145deg, rgba(79, 110, 247, 0.1) 0%, rgba(142, 68, 173, 0.05) 100%);
            border: 1px solid rgba(79, 110, 247, 0.3);
            border-radius: 24px;
            padding: 30px;
            opacity: 0;
            transform: translateX(20px);
            animation: slideInRight 0.8s ease-out forwards 1s;
            position: relative;
            overflow: hidden;
        }

        .case-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(46, 204, 113, 0.2);
            color: #2ECC71;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .case-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #FFF;
        }

        .case-detail {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .detail-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            flex-shrink: 0;
        }

        .detail-text h4 {
            font-size: 1rem;
            font-weight: 600;
            color: #FFF;
            margin-bottom: 4px;
        }

        .detail-text p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }

        /* Counter Animation */
        .counter { display: inline-block; }

        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }

    </style>
</head>

    <script>
        // Counter Animation
        function animateCounter(element, target, duration = 1500) {
            const start = 0;
            const startTime = Date.now();
            
            function update() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3); // Cubic ease out
                
                const current = start + (target - start) * ease;
                
                if (target % 1 === 0) {
                    element.textContent = Math.floor(current);
                } else {
                    element.textContent = current.toFixed(1);
                }
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = target; // Ensure final value is exact
                }
            }
            update();
        }

        setTimeout(() => {
            const counters = document.querySelectorAll('.counter');
            counters.forEach(counter => {
                const target = parseFloat(counter.getAttribute('data-target'));
                animateCounter(counter, target);
            });
        }, 500);
    </script>
