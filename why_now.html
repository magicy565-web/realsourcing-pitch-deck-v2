    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', 'Noto Sans SC', sans-serif; }

        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            background-color: #0A0A0F;
            color: #FFFFFF;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Video Background — very subtle, not competing with content */
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.15;
        }

        /* Header */
        .header {
            z-index: 2;
            padding: 36px 80px 0;
            opacity: 0;
            animation: fadeInDown 0.7s ease-out forwards;
        }
        .section-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #4F6EF7;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .main-title {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        /* Two-column layout */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            z-index: 2;
            padding: 24px 80px 36px;
            flex: 1;
            align-items: stretch;
        }

        /* Card — solid dark background for readability */
        .card {
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
        }

        .card-left {
            background: #12121A;
            border: 1px solid rgba(255,255,255,0.08);
            animation: slideInLeft 0.8s ease-out forwards 0.2s;
        }

        .card-right {
            background: #0E0E1C;
            border: 1px solid rgba(79,110,247,0.35);
            animation: slideInRight 0.8s ease-out forwards 0.4s;
        }

        /* Image section — no overlay needed since images have matching dark bg */
        .card-image {
            width: 100%;
            height: 210px;
            overflow: hidden;
        }
        .card-image img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Card body */
        .card-body {
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            background: inherit;
        }

        .card-header-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge-red { background: rgba(231,76,60,0.2); color: #E74C3C; }
        .badge-green { background: rgba(46,204,113,0.2); color: #2ECC71; }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #FFF;
        }

        .card-desc {
            font-size: 0.9rem;
            line-height: 1.65;
            color: rgba(255,255,255,0.7);
        }
        .highlight { color: #4F6EF7; font-weight: 600; }
        .danger { color: #E74C3C; }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.75);
        }
        .tag-blue {
            background: rgba(79,110,247,0.12);
            border-color: rgba(79,110,247,0.35);
            color: #7B9BFF;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
